name: Kıvılcım Diyarı APK

on:
  push:
    paths:
      - 'kivilcim-diyari/**'
      - 'minik-art/**'
      - '.github/workflows/kivilcim-diyari-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kivilcim-diyari-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the web game into the Android assets
        working-directory: kivilcim-diyari
        run: node build.mjs --android

      - name: Build the APK
        working-directory: kivilcim-diyari/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp kivilcim-diyari/android/app/build/outputs/apk/debug/app-debug.apk kivilcim-diyari.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kivilcim-diyari-apk
          path: kivilcim-diyari.apk

      - name: Publish to the "kivilcim-diyari-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete kivilcim-diyari-latest --yes --cleanup-tag || true
          gh release create kivilcim-diyari-latest kivilcim-diyari.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Kıvılcım Diyarı (son sürüm)" \
            --notes "Android için en son Kıvılcım Diyarı APK'sı (dal: ${{ github.ref_name }}, commit: ${{ github.sha }}). Telefonda bu sayfadan kivilcim-diyari.apk dosyasını indir, açınca 'bilinmeyen kaynaklara izin ver' de ve kur."
