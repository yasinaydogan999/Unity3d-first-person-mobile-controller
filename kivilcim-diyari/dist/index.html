<title>Kıvılcım Diyarı</title>
<style>
:root{
  /* Layout: landscape stage; stats + clock top-left, quest pill top-centre, minimap top-right, joystick bottom-left, hotbar bottom-centre, action cluster bottom-right */
  --ink:#3d2b45; --paper:#fff7ea; --paper-2:#f3e3c4; --card:#fffdf7; --muted:#6b5872;
  --coral:#ff7f5c; --sun:#ffc94a; --leaf:#4fb565; --teal:#5cc0b5; --plum:#8e6fd6; --night:#2a2257;
  --hp:#ff6b7f; --food:#ffae45; --warm:#ff8457;
  --font:"Baloo 2","Arial Rounded MT Bold",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px); --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#efe4cf;color:var(--ink);font-family:var(--font);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#stage{position:fixed;inset:0;display:block;touch-action:none}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.panel{background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink)}
.sketch{background-image:repeating-linear-gradient(-45deg,rgba(61,43,69,.05) 0 1px,transparent 1px 6px)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
#hud .pe{pointer-events:auto}
.tl{position:absolute;top:calc(var(--st) + 6px);left:calc(var(--sl) + 8px);display:flex;gap:6px;align-items:flex-start}
.stats{padding:4px 9px 4px 6px;display:grid;gap:1px}
.stat{display:flex;align-items:center;gap:5px}
.stat img{width:20px;height:20px}
.bar{width:clamp(70px,13vw,120px);height:10px;border-radius:7px;background:#ead9bf;border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;transform-origin:left;transition:transform .2s linear}
#bHp{background:var(--hp)} #bFood{background:var(--food)} #bWarm{background:var(--warm)}
.stat.low{animation:pulse .7s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.clock{display:flex;align-items:center;gap:5px;padding:2px 10px 2px 3px;height:34px;box-sizing:border-box}
.clock img{width:28px;height:28px}
.clock div{display:flex;flex-direction:column;line-height:1}
.clock b{font-size:15px}
.clock span{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.clock .home{font-size:11px;color:#2f8f5e}
#quest{position:absolute;top:calc(var(--st) + 6px);left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:3px 12px 3px 4px;max-width:min(40vw,420px);font-weight:700;font-size:13px;line-height:1.15;text-align:left}
#quest img{width:26px;height:26px;flex:none}
#quest small{display:block;color:var(--muted);font-size:11.5px}
.tr{position:absolute;top:calc(var(--st) + 6px);right:calc(var(--sr) + 8px);display:flex;gap:6px;align-items:flex-start}
#mapWrap{width:92px;height:92px;border-radius:50%;overflow:hidden;padding:0;position:relative}
#mini{width:100%;height:100%;display:block}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.iconbtn img{width:24px;height:24px}
#hotbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 8px);display:flex;gap:4px;padding:4px;border-radius:16px}
.slot{width:46px;height:46px;border-radius:11px;background:#f6ead3;border:2px solid rgba(61,43,69,.35);position:relative;display:grid;place-items:center;box-sizing:border-box}
.slot img{width:36px;height:36px}
.slot b{position:absolute;right:2px;bottom:-1px;font-size:12.5px;font-weight:800;text-shadow:0 0 3px #fff,0 0 3px #fff;font-variant-numeric:tabular-nums}
.slot.on{background:#fff2b8;border-color:var(--ink);box-shadow:0 0 0 3px var(--sun)}
.slot.empty{opacity:.55}
.acts{position:absolute;right:calc(var(--sr) + 12px);bottom:calc(var(--sb) + 12px);display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:8px 10px;align-items:center}
.cbtn{width:58px;height:58px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:11.5px;line-height:1;gap:0;position:relative}
.cbtn img{width:30px;height:30px}
.cbtn .dot{position:absolute;top:-3px;right:-3px;width:15px;height:15px;border-radius:50%;background:var(--leaf);border:2.5px solid var(--ink)}
#bagBtn{grid-column:1;grid-row:1} #eatBtn{grid-column:1;grid-row:2}

<script>
/* ---- ../minik-art/core.js ---- */
/*
 * MinikArt — an original, reusable vector art kit for cute 2.5D canvas games.
 * Everything is drawn in code (no images), so assets scale to any resolution
 * and can be exported to PNG sprite sheets (see tools/export-assets.mjs).
 *
 * Usage:
 *   MinikArt.draw(ctx, 'st.bed', x, y, {used: true, t: seconds, scale: 1, flip: false});
 *   MinikArt.toCanvas('char.ece', {pose: 'walk', t: 0.2}, 2)  -> HTMLCanvasElement
 *
 * Conventions (see art/STYLE.md):
 *   - 1 art unit = 1 px at scale 1. Interior room height (floor to ceiling) = 130.
 *   - Each asset draws around its ANCHOR at (0,0). Most props: bottom-centre on the floor.
 *   - Positive y is down, so standing things are drawn at negative y.
 *   - Outline colour P.ink, line width LW, round joins. Flat fills + one highlight.
 */
(function (root) {
  'use strict';
  const TAU = Math.PI * 2;
  const P = {
    ink: '#3d2b45', inkSoft: 'rgba(61,43,69,.35)', shadow: 'rgba(61,43,69,.2)',
    cream: '#fff7ea', paper: '#ffe8c7', white: '#ffffff',
    coral: '#ff7f5c', coralDark: '#e8623f', sun: '#ffc94a', sunLight: '#ffe08a',
    leaf: '#5fbf6e', leafDark: '#4a9f59', leafLight: '#93dc89',
    mint: '#7fd3c7', teal: '#5cc0b5', tealDark: '#2f6f69',
    sky: '#7ed0ea', skyDeep: '#4f9de0', skyNight: '#2a2257', skyDusk: '#ff9f80',
    lilac: '#b9a3ff', plum: '#8e6fd6', plumDark: '#5c3f8e',
    pink: '#f59cc4', rose: '#ff6b8b', berry: '#ff4f74', blush: 'rgba(255,120,140,.55)',
    wood: '#c98a5d', woodDark: '#a7704f', woodLight: '#eaae73', woodDeep: '#8a5a3c',
    metal: '#a9b3d6', metalDark: '#7d86ab', metalLight: '#d9def0',
    stone: '#bdb8d6', stoneLight: '#e2def2', stoneDark: '#9a94b8',
    snow: '#f4f8ff', snowShade: '#d6e3f5', ice: '#bfe8f7',
    glass: '#bfe8f7', glassNight: '#3b3478',
    fire1: '#ff6b3d', fire2: '#ffa53d', fire3: '#fff09a', glow: '#ffd98a',
    skin1: '#ffdcc0', skin2: '#f2c09a', skin3: '#c98e66', skin4: '#8d5a3c',
    hairBrown: '#7a4b35', hairBlack: '#3a2c3f', hairBlond: '#f2c45c', hairRed: '#d9673f', hairPink: '#f08fb0',
  };
  const OL = P.ink;
  const LW = 2.5;
  const reg = new Map();
  const warned = new Set();

  // ---------- registry ----------
  function define(name, def) {
    if (!name || typeof def.draw !== 'function') throw new Error('MinikArt.define: bad asset ' + name);
    const d = {
      name,
      w: def.w || 64, h: def.h || 64,
      ax: def.ax != null ? def.ax : (def.w || 64) / 2,
      ay: def.ay != null ? def.ay : (def.h || 64),
      tags: def.tags || [],
      states: def.states || {},
      defaults: def.defaults || {},
      desc: def.desc || '',
      draw: def.draw,
    };
    reg.set(name, d);
    return d;
  }
  function has(name) { return reg.has(name); }
  function get(name) { return reg.get(name); }
  function list(prefix) { return [...reg.keys()].filter(k => !prefix || k.startsWith(prefix)).sort(); }

  function missing(ctx, name, x, y) {
    if (!warned.has(name)) { warned.add(name); if (root.console) console.warn('MinikArt: missing asset', name); }
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = 'rgba(255,0,170,.5)'; ctx.fillRect(-16, -32, 32, 32);
    ctx.restore();
  }

  /** Draw asset `name` with its anchor at (x, y). opts: scale, flip, alpha, t, plus asset states. */
  function draw(ctx, name, x, y, opts) {
    const d = reg.get(name);
    if (!d) { missing(ctx, name, x, y); return false; }
    const o = opts ? Object.assign({}, d.defaults, opts) : Object.assign({}, d.defaults);
    if (o.t == null) o.t = 0;
    ctx.save();
    ctx.translate(x, y);
    const s = o.scale || 1, f = o.flip ? -1 : 1;
    if (s !== 1 || f !== 1) ctx.scale(s * f, s);

    try { d.draw(ctx, o); } catch (e) { if (!warned.has(name + '!')) { warned.add(name + '!'); console.error('MinikArt draw error', name, e); } }

  function toCanvas(name, opts, scale, pad) {
    const d = reg.get(name); if (!d) return null;
    scale = scale || 1; pad = pad == null ? 6 : pad;
    const o = Object.assign({}, opts || {});
    const W = o.w != null && d.tags.includes('sized') ? o.w : d.w;
    const H = o.h != null && d.tags.includes('sized') ? o.h : d.h;
    const ax = d.tags.includes('sized') ? 0 : d.ax, ay = d.tags.includes('sized') ? 0 : d.ay;
    const c = document.createElement('canvas');
    c.width = Math.ceil((W + pad * 2) * scale); c.height = Math.ceil((H + pad * 2) * scale);
    const cx = c.getContext('2d');
    cx.scale(scale, scale);
    draw(cx, name, ax + pad, ay + pad, Object.assign({}, o, { scale: 1, flip: false }));
    cx.setTransform(1, 0, 0, 1, 0, 0);
    return c;
  }

  // ---------- helpers (all take ctx first) ----------
  function rr(ctx, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();

    if (lw !== 0) { ctx.lineWidth = lw || LW; ctx.strokeStyle = OL; ctx.stroke(); }
  }
  function circ(ctx, x, y, r, fill, lw) {
    ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (lw !== 0) { ctx.lineWidth = lw || LW; ctx.strokeStyle = OL; ctx.stroke(); }
  }
  function ell(ctx, x, y, rx, ry, fill, lw, rot) {
    ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot || 0, 0, TAU);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = OL; ctx.stroke(); }
  }
  /** Union of circles [[x,y,r],...] with a single outer outline. */
  function blob(ctx, cs, fill, lw) {
    const o = lw == null ? LW : lw;
    if (o) { ctx.fillStyle = OL; for (const c of cs) { ctx.beginPath(); ctx.arc(c[0], c[1], c[2] + o, 0, TAU); ctx.fill(); } }
    ctx.fillStyle = fill; for (const c of cs) { ctx.beginPath(); ctx.arc(c[0], c[1], c[2], 0, TAU); ctx.fill(); }
  }
  function line(ctx, x1, y1, x2, y2, col, lw) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = col || OL; ctx.lineWidth = lw || LW; ctx.stroke();
  }
  /** Thick stick with ink outline (e.g. handles, legs, pipes). */
  function stick(ctx, x1, y1, x2, y2, col, w) {
    line(ctx, x1, y1, x2, y2, OL, w + LW * 2); line(ctx, x1, y1, x2, y2, col, w);
  }
  function poly(ctx, pts, fill, lw) {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (lw !== 0) { ctx.lineWidth = lw || LW; ctx.strokeStyle = OL; ctx.stroke(); }
  }
  /** Smooth closed path through points (quadratic midpoints). Path only. */
  function smoothPath(ctx, pts) {
    const n = pts.length; ctx.beginPath();
    ctx.moveTo((pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2);
    for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; ctx.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
    ctx.closePath();
  }
  function star(ctx, x, y, r, fill, points) {
    const n = (points || 4) * 2; ctx.beginPath();
    for (let i = 0; i < n; i++) { const a = i / n * TAU - Math.PI / 2, rad = i % 2 ? r * .4 : r; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }

// ===== 10-world: infinite chunked world, biomes, ruins, persistence diffs, spatial queries =====
const h2 = (x, y, s) => K.hash2(x, y, s);
function vnoise(x, y, s) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const a = h2(ix, iy, s), b = h2(ix + 1, iy, s), c = h2(ix, iy + 1, s), d = h2(ix + 1, iy + 1, s);
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
}
function fbm(x, y, s) { return vnoise(x, y, s) * .6 + vnoise(x * 2.07, y * 2.07, s + 17) * .28 + vnoise(x * 4.3, y * 4.3, s + 31) * .12; }

/** Base (generated) tile at tile coords. */
function genTile(tx, ty) {
  const S = G.seed;
  let e = fbm(tx / 34, ty / 34, S + 1);
  const d = Math.hypot(tx, ty);
  if (d < 16) e = Math.max(e, .56 - d * .008);
  if (e < .3) return TL.DEEP;
  if (e < .345) return TL.WATER;
  if (e < .385) return TL.SAND;
  if (fbm(tx / 26, ty / 26, S + 5) > .67 && d > 8) return TL.STONE;
  // a sunny clearing around the start so there is room for the first hut and field
  if (fbm(tx / 22, ty / 22, S + 9) > .58 + Math.max(0, 13 - d) * .025) return TL.FOREST;
  if (vnoise(tx / 13, ty / 13, S + 13) > .66) return TL.MEADOW;
  return TL.GRASS;
}

const chunks = new Map();
const ckey = (cx, cy) => cx + ',' + cy;
function modOf(key) { return G.mods[key] || (G.mods[key] = { rm: {}, st: {}, add: [], tiles: {} }); }

function genChunk(cx, cy) {
  const S = G.seed, key = ckey(cx, cy);
  const tiles = new Uint8Array(CH * CH);
  const x0 = cx * CH, y0 = cy * CH;
  for (let j = 0; j < CH; j++) for (let i = 0; i < CH; i++) tiles[j * CH + i] = genTile(x0 + i, y0 + j);
  const objs = [];
  let n = 0;
  const add = (o) => { o.id = 'g' + key + ':' + (n++); o.gen = 1; if (o.x == null) { o.x = o.tx * T + T / 2; o.y = o.ty * T + T; } objs.push(o); return o; };
  const taken = new Uint8Array(CH * CH);
  const nearWater = (i, j) => { for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) { const t = (i + di >= 0 && i + di < CH && j + dj >= 0 && j + dj < CH) ? tiles[(j + dj) * CH + i + di] : genTile(x0 + i + di, y0 + j + dj); if (WATERY(t)) return true; } return false; };
  // ruin
  const rh = h2(cx, cy, S + 777);
  if (rh < .085 && Math.hypot(cx, cy) > 1.2) {
    const rw = 5 + (h2(cx, cy, S + 778) < .5 ? 1 : 0), rhh = 4 + (h2(cx, cy, S + 779) < .5 ? 1 : 0);
    const ox = 3 + Math.floor(h2(cx, cy, S + 780) * (CH - rw - 6)), oy = 3 + Math.floor(h2(cx, cy, S + 781) * (CH - rhh - 6));
    let ok = true;
    for (let j = oy - 1; j <= oy + rhh && ok; j++) for (let i = ox - 1; i <= ox + rw && ok; i++) if (WATERY(tiles[j * CH + i])) ok = false;
    if (ok) {
      const door = ox + (rw >> 1);
      for (let j = oy; j < oy + rhh; j++) for (let i = ox; i < ox + rw; i++) {
        tiles[j * CH + i] = TL.FLOOR; taken[j * CH + i] = 1;
        const edge = j === oy || j === oy + rhh - 1 || i === ox || i === ox + rw - 1;
        if (!edge) continue;
        if (j === oy + rhh - 1 && (i === door || i === door - 1)) continue;
        const hv = h2(x0 + i, y0 + j, S + 782);
        if (j !== oy && hv < .22) continue;
        const hh = j === oy ? 34 + hv * 8 : j === oy + rhh - 1 ? 12 + hv * 10 : 18 + hv * 18;
        add({ k: 'wall', mat: 'ruin', hh: Math.round(hh), crack: hv > .7, tx: x0 + i, ty: y0 + j });
      }
      const inner = [];
      for (let j = oy + 1; j < oy + rhh - 1; j++) for (let i = ox + 1; i < ox + rw - 1; i++) inner.push([i, j]);
      const nc = 1 + (h2(cx, cy, S + 783) < .5 ? 1 : 0);
      for (let k = 0; k < nc && inner.length; k++) {
        const [i, j] = inner.splice(Math.floor(h2(cx, cy, S + 790 + k) * inner.length), 1)[0];
        add({ k: 'crate', tx: x0 + i, ty: y0 + j, x: (x0 + i) * T + T / 2, y: (y0 + j) * T + T - 4, r: 14, hp: 2, open: false, loot: Math.floor(h2(cx, cy, S + 800 + k) * 1e6) });
      }
    }
  }
  // spawn camp
  if (cx === 0 && cy === 0) {
    add({ k: 'radio', tx: 1, ty: -2, x: 1 * T + T / 2, y: -2 * T + T, r: 22 });
    for (let j = -3; j <= 3; j++) for (let i = -3; i <= 3; i++) if (i >= 0 && j >= 0) taken[j * CH + i] = 1;
  }
  if (cx === -1 && cy === -1 || cx === 0 && cy === -1 || cx === -1 && cy === 0) {
    for (let j = 0; j < CH; j++) for (let i = 0; i < CH; i++) if (Math.hypot(x0 + i, y0 + j) < 3.2) taken[j * CH + i] = 1;
  }
  // nature
  for (let j = 0; j < CH; j++) for (let i = 0; i < CH; i++) {
    const idx = j * CH + i; if (taken[idx]) continue;
    const tx = x0 + i, ty = y0 + j, t = tiles[idx];
    if (Math.hypot(tx, ty) < 3.2) continue;
    const hv = h2(tx, ty, S + 101), jx = (h2(tx, ty, S + 102) - .5) * 18, jy = (h2(tx, ty, S + 103) - .5) * 14;
    const x = tx * T + T / 2 + jx, y = ty * T + T * .7 + jy;
    let o = null;
    const tree = () => { const kn = vnoise(tx / 9, ty / 9, S + 120); let kind = kn < .45 ? 0 : kn < .62 ? 1 : kn < .78 ? 0 : 2; if (t === TL.FOREST && h2(tx, ty, S + 121) < .3) kind = 3; return { k: 'tree', kind, s: [.92, 1, 1.08][Math.floor(h2(tx, ty, S + 122) * 3)], r: 13, hp: 4 }; };
    if (t === TL.GRASS) {
      if (hv < .035) o = tree(); else if (hv < .06) o = { k: 'bush', berries: 3, r: 12 }; else if (hv < .13) o = { k: 'grass', r: 0 };
      else if (hv < .142) o = { k: 'rock', seed: 1 + Math.floor(h2(tx, ty, 5) * 3), s: .9, r: 15, hp: 5 }; else if (hv < .19) o = { k: 'flowers', kind: Math.floor(h2(tx, ty, 9) * 3), r: 0 };
      else if (hv < .195) o = { k: 'mush', kind: 0, r: 0 };
    } else if (t === TL.FOREST) {
      if (hv < .3) o = tree(); else if (hv < .33) o = { k: 'bush', berries: 3, r: 12 }; else if (hv < .37) o = { k: 'mush', kind: h2(tx, ty, 4) < .25 ? 1 : 0, r: 0 };
      else if (hv < .385) o = { k: 'log', r: 18, hp: 2 }; else if (hv < .42) o = { k: 'grass', r: 0 };
    } else if (t === TL.MEADOW) {
      if (hv < .24) o = { k: 'flowers', kind: Math.floor(h2(tx, ty, 9) * 3), r: 0 }; else if (hv < .32) o = { k: 'grass', r: 0 };
      else if (hv < .37) o = { k: 'bush', berries: 3, r: 12 }; else if (hv < .39) o = tree();
    } else if (t === TL.STONE) {
      if (hv < .18) o = { k: 'rock', seed: 1 + Math.floor(h2(tx, ty, 5) * 3), s: .9 + h2(tx, ty, 6) * .35, r: 16, hp: 5 }; else if (hv < .2) o = { k: 'grass', r: 0 };
    } else if (t === TL.SAND) {
      if (hv < .14 && nearWater(i, j)) o = { k: 'reeds', r: 0 }; else if (hv < .17) o = { k: 'rock', seed: 2, s: .7, r: 12, hp: 3 };
    }
    if (o) { o.tx = tx; o.ty = ty; o.x = x; o.y = y; add(o); }
  }
  return { cx, cy, key, tiles, objs };
}

/** Apply saved changes on top of a generated chunk. */
function loadChunk(cx, cy) {
  const key = ckey(cx, cy);
  let c = chunks.get(key);
  if (c) return c;
  c = genChunk(cx, cy);
  const m = G.mods[key];
  if (m) {
    c.objs = c.objs.filter(o => !m.rm[o.id]);
    for (const o of c.objs) if (m.st[o.id]) Object.assign(o, m.st[o.id]);
    for (const i in m.tiles) c.tiles[+i] = m.tiles[i];
    for (const o of m.add) c.objs.push(o);
  }
  c.occ = new Map();
  for (const o of c.objs) occSet(c, o);
  chunks.set(key, c);
  catchUpChunk(c);
  return c;
}
function occSet(c, o) {
  if (o.k === 'flowers') return;
  const w = o.fw || 1;
  for (let k = 0; k < w; k++) c.occ.set((o.tx + k) + ',' + o.ty, o);
}
function occDel(o) {
  const w = o.fw || 1;

// ----- crafting -----
function nearStation(kind) {
  const p = G.p;
  for (const o of objsIn(p.x - 200, p.y - 200, p.x + 200, p.y + 240)) {
    if (o.k !== 'thing') continue;
    const d = Math.hypot(o.x - p.x, o.y - p.y);
    if (d > 170) continue;
    if (kind === 'bench' && o.item === 'bench') return true;
    if (kind === 'stove' && o.item === 'stove') return true;
    if (kind === 'heat' && (o.item === 'stove' || o.item === 'heater' || o.thing === 'fire' && o.until > G.wt)) return true;
  }
  return false;
}
function recipeState(r) {
  if (ITEMS[r.id].tool && have(r.id)) return { ok: false, why: 'Var', own: true };
  if (r.need && !nearStation(r.need)) return { ok: false, why: NEED_NAME[r.need], need: true };
  if (!canPay(r.cost)) return { ok: false, why: 'Malzeme eksik' };
  return { ok: true };
}
function craft(id) {
  const r = RECIPES.find(x => x.id === id); if (!r) return false;
  const st = recipeState(r);
  if (!st.ok) { toast(st.why, 'icon.cross'); sfx('deny'); return false; }
  pay(r.cost); give(id, r.n || 1, null, null, true);
  if (r.cat === 'food' && r.id !== 'meds') G.stat.cooked++;
  const it = ITEMS[id];
  if (it.place || it.tool || it.seed || it.use) selectItem(id);
  toast(`${it.n}${(r.n || 1) > 1 ? ' ×' + r.n : ''} hazır!`, it.ic || 'icon.build');
  sfx('build'); vibrate(15);
  return true;
}

// ----- eating -----
function foodValue(k) { const it = ITEMS[k]; return it.food ? Math.round(it.food * (G.char === 'ece' ? 1.5 : 1)) : 0; }
function eatBest() {
  const p = G.p;
  const h = held();
  if (h && ITEMS[h].heal) { useMeds(); return; }
  if (h && ITEMS[h].food) { eat(h); return; }
  if (p.food >= 96) { if (p.hp < 70 && have('meds')) { useMeds(); return; } toast('Karnın tok', 'icon.hunger'); return; }
  const foods = Object.keys(ITEMS).filter(k => ITEMS[k].food && have(k) > 0);
  if (!foods.length) { if (p.hp < 70 && have('meds')) { useMeds(); return; } toast('Yiyecek yok: çalılardan meyve topla, tarla ek!', 'icon.hunger'); sfx('deny'); return; }
  const need = 100 - p.food;
  foods.sort((a, b) => Math.abs(foodValue(a) - need) - Math.abs(foodValue(b) - need));

}
function eat(k) {
  const p = G.p, it = ITEMS[k];
  G.inv[k]--; p.food = Math.min(100, p.food + foodValue(k)); if (it.hp) p.hp = Math.min(100, p.hp + it.hp);

// ----- mobs -----

  const dx = m.x - p.x, dy = m.y - p.y, d = Math.hypot(dx, dy) || 1;
  m.kx = dx / d * 300; m.ky = dy / d * 300; m.cd = Math.max(m.cd, .5);
  sfx('hit'); burst(m.x, m.y - 18, 5, '#9b7fd4', 'dot'); camShake(.2);
  if (m.hp <= 0) { m.gone = true; G.stat.kills++; burst(m.x, m.y - 16, 12, '#8a6cc4', 'poof'); burst(m.x, m.y - 20, 4, '#ffe873', 'star'); sfx('poof'); if (rand() < .3) give('scrap', 1, m.x, m.y - 40); }
}
function spawnMob() {
  const p = G.p;
  for (let k = 0; k < 20; k++) {
    const a = rand() * TAU, d = 520 + rand() * 260, x = p.x + Math.cos(a) * d, y = p.y + Math.sin(a) * d * .7;
    if (blockedAt(x, y, 12) || lightAt(x, y, 1.4)) continue;

}
function updateMobs(dt) {
  const p = G.p, night = G.t >= .63 || G.t < .01, safe = indoors(p.x, p.y);

    G.spawnT -= dt;
    if (G.spawnT <= 0) { G.spawnT = 5 + rand() * 4; const cap = Math.min(2 + Math.floor(G.day / 2), 8); if (G.mobs.filter(m => !m.dying).length < cap) spawnMob(); }
  }
  const dawn = G.t < .5 && G.t >= .012;
  for (const m of G.mobs) {
    if (m.gone) continue;
    m.wob += dt * 6;
    if (dawn && !m.dying) m.dying = true;
    if (m.dying) { m.a -= dt * 1.3; if (m.a <= 0) { m.gone = true; burst(m.x, m.y - 16, 8, '#8a6cc4', 'poof'); } continue; }
    m.a = Math.min(1, m.a + dt * 1.2); m.flash = Math.max(0, m.flash - dt); m.cd = Math.max(0, m.cd - dt);
    let dx = 0, dy = 0, sp = m.spd;
    const fin = lightAt(m.x, m.y, .92);
    const dp = Math.hypot(p.x - m.x, p.y - m.y);
    if (fin) { dx = m.x - fin.x; dy = m.y - fin.y; sp *= 1.3; }
    else if (dp < 520 && !safe && !G.sleep) {
      const pl = lightAt(p.x, p.y, 1);
      if (pl || have('lantern') && dp > 120) { const ax = m.x - p.x, ay = m.y - p.y, al = Math.hypot(ax, ay) || 1, R = pl ? 0 : 150; const tx = (pl ? pl.x : p.x) + ax / al * ((pl ? pl.r : R) + 24) - ay / al * Math.sin(m.wob * .2) * 30, ty = (pl ? pl.y : p.y) + ay / al * ((pl ? pl.r : R) + 24) + ax / al * Math.sin(m.wob * .2) * 30; dx = tx - m.x; dy = ty - m.y; sp *= .55; }
      else { dx = p.x - m.x; dy = p.y - m.y; }
    } else { m.wa += (rand() - .5) * dt * 3; dx = Math.cos(m.wa); dy = Math.sin(m.wa); sp *= .35; }
    const dl = Math.hypot(dx, dy); if (dl > 0) { dx /= dl; dy /= dl; }
    const k = Math.min(1, dt * 5); m.vx += (dx * sp - m.vx) * k; m.vy += (dy * sp - m.vy) * k;
    const kd = Math.pow(.004, dt); m.kx *= kd; m.ky *= kd;
    moveEnt(m, (m.vx + m.kx) * dt, (m.vy + m.ky) * dt, 11, true);
    if (!fin && m.a > .6 && !G.sleep && m.cd <= 0 && dp < 26) {
      p.hp -= 8; p.hurt = .45; m.cd = 1.1; G.cause = 'mob';
      const ux = (p.x - m.x) / (dp || 1), uy = (p.y - m.y) / (dp || 1);

    }
  }
  if (G.mobs.some(m => m.gone)) G.mobs = G.mobs.filter(m => !m.gone);
}

// ----- day cycle, weather, crops -----
function newDay() {
  G.day++;
  G.weather = rand() < .25 ? 'rain' : 'clear';
  for (const m of G.mobs) m.dying = true;
  for (const c of chunks.values()) {
    for (let i = 0; i < c.tiles.length; i++) if (c.tiles[i] === TL.WSOIL && G.weather !== 'rain') { c.tiles[i] = TL.SOIL; modOf(c.key).tiles[i] = TL.SOIL; }
    for (const o of c.objs) if (o.k === 'crop') patchObj(o, { wet: G.weather === 'rain' });
  }
  if (G.day % 4 === 0) spawnTrader(); else G.trader = null;
  banner(`${G.day}. Gün`, G.weather === 'rain' ? 'Yağmur yağıyor: ekinler kendiliğinden sulanıyor.' : pick(['Güneş doğdu, gölgecikler eridi.', 'Yeni bir gün, yeni bir macera.', 'Kuşlar ötüyor. Tarlana bir bak!']));
  sfx('morning'); save();
}
function growCrop(o, hours) {

  const rate = 1 / c.hours * (o.wet || G.weather === 'rain' ? 2 : 1) * (G.char === 'deniz' ? 1.5 : 1);

// ----- cat -----
function updateCat(dt) {

  if (d > 900) { c.x = tx; c.y = ty; }
  if (d > 70) { const sp = Math.min(220, 60 + d * 1.2) * dt; c.x += (tx - c.x) / d * sp; c.y += (ty - c.y) / d * sp; c.pose = 'walk'; c.flip = tx < c.x; c.idle = 0; }

  const [a, b] = q.c(G);
  if (a >= b) {
    for (const k in q.r) give(k, q.r[k], null, null, true);
    G.q++;

    sfx('fanfare'); vibrate([20, 40, 20]); save();

}

// ----- main player update -----
function updatePlayer(dt, mx, my, actDown) {
  const p = G.p;
  p.anim += dt; p.swing = Math.max(0, p.swing - dt); p.cd = Math.max(0, p.cd - dt); p.hurt = Math.max(0, p.hurt - dt); p.rest = Math.max(0, p.rest - dt); if (p.eatT) p.eatT = Math.max(0, p.eatT - dt);
  const m = Math.hypot(mx, my);
  if (m > .05 && !G.sleep) {
    const sp = 150 * (G.char === 'lale' ? 1.25 : 1) * (p.food <= 0 ? .75 : 1) * Math.min(1, Math.max(.4, m));
    moveEnt(p, mx / m * sp * dt, my / m * sp * dt, 12, false);
    p.fx = mx / m; p.fy = my / m; if (Math.abs(mx) > .15) p.flip = mx < 0;
    p.pose = 'walk'; p.fish = null;
  } else p.pose = p.fish ? 'search' : p.swing > 0 ? 'work' : p.eatT ? 'eat' : 'idle';
  if (p.swing > 0 && m > .05) p.pose = 'work';
  if (p.fish) {
    p.fish.t += dt;
    if (p.fish.t >= p.fish.dur) { if (rand() < .78) { give('fish', 1, p.fish.x, p.fish.y - 30); sfx('splash'); } else toast('Balık kaçtı!', 'icon.fish'); p.fish = null; }
  }
  target = G.sleep ? null : findTarget();
  if (actDown && p.cd <= 0 && !G.sleep && !p.fish) doAction();
  // stats
  const dark = darkness(G.t), inside = indoors(p.x, p.y), heat = heatAt(p.x, p.y);
  p.food = Math.max(0, p.food - dt * .25);
  if (heat) p.warm = Math.min(100, p.warm + dt * 8);
  else if (inside) p.warm = Math.min(100, p.warm + dt * 2);
  else if (dark > .3) p.warm = Math.max(0, p.warm - dt * .9 * (dark / .78) * (have('lantern') ? .7 : 1));
  else p.warm = Math.min(100, p.warm + dt * (G.weather === 'rain' ? .2 : 1.5));
  let drain = 0; if (p.food <= 0) { drain += .8; G.cause = 'hunger'; } if (p.warm <= 0) { drain += 1; G.cause = 'cold'; }
  if (drain) p.hp -= drain * dt; else if (p.food > 50 && p.warm > 40) p.hp = Math.min(100, p.hp + dt * .4);
  G.inside = inside;
  const far = Math.hypot(p.x - G.home.x, p.y - G.home.y) / T; if (far > G.stat.far) G.stat.far = far;

}
function faint() {
  const p = G.p;
  p.hp = 60; p.food = Math.max(p.food, 45); p.warm = Math.max(p.warm, 70);
  p.x = G.home.x; p.y = G.home.y; G.mobs.forEach(m => m.dying = true);
  showStory('Bayıldın...', { mob: 'Gölgecikler seni çok yordu.', cold: 'Gece soğuğu seni üşüttü.', hunger: 'Açlıktan dizlerin titredi.' }[G.cause] + ' Pamuk seni evine kadar sürükledi. Eşyaların yerinde, devam!', 'faint');
}

function simulate(dt, input) {
  if (G.sleep) updateSleep(dt);
  else {
    const prev = G.t; G.t += dt / DAY_LEN;
    if (prev < NIGHT_AT && G.t >= NIGHT_AT) { banner('Gece çöküyor', 'Evine, ateşinin ya da meşalelerinin yanına dön.'); sfx('night'); G.spawnT = 3; }
    if (G.t >= 1) { G.t -= 1; newDay(); }
  }
  G.wt = (G.day - 1) * 24 + G.t * 24;
  streamChunks(G.p.x, G.p.y);
  collectLights();
  updatePlayer(dt, input.mx, input.my, input.act);
  updateMobs(dt); updateCrops(dt); updateCat(dt); updateQuests(dt);
  if (G.trader && G.t > .58) { G.trader = null; toast('Bay Bıyık yoluna devam etti', 'icon.trade'); }
  G.saveT += dt; if (G.saveT > 20) { G.saveT = 0; save(); }
}

  const glow = Math.max(0, 1 - Math.abs(G.t - .58) / .06) + Math.max(0, 1 - Math.abs(G.t - .02) / .03);
  if (glow > 0) { ctx.fillStyle = `rgba(255,150,100,${Math.min(1, glow) * .14})`; ctx.fillRect(0, 0, cvs.width, cvs.height); }
  if (G.weather === 'rain') drawRain(t);
  // mob eyes glow through the dark
  ctx.setTransform(s, 0, 0, s, VW / 2 * DPR - cx * s, VH / 2 * DPR - cy * s);
  for (const m of G.mobs) {
    const a = Math.max(0, Math.min(1, m.a)); if (a <= 0) continue;
    let lx = G.p.x - m.x, ly = G.p.y - m.y; const l = Math.hypot(lx, ly) || 1; lx = lx / l * 2; ly = ly / l * 1.5;
    ctx.globalAlpha = a;
    for (const ex of [-6, 6]) { K.ell(ctx, m.x + ex, m.y - 20, 4.6, 5.6, '#fff3a3'); K.circ(ctx, m.x + ex + lx, m.y - 20 + ly, 2.3, K.P.ink, 0); if (d > .3) { ctx.globalAlpha = a * .25; K.circ(ctx, m.x + ex, m.y - 20, 9, '#fff3a3', 0); ctx.globalAlpha = a; } }
    ctx.globalAlpha = 1;
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (!OPTS.lite) {
    ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .24;
    ctx.fillStyle = K.paperPattern(ctx, 256, 11); ctx.fillRect(0, 0, cvs.width, cvs.height);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  if (!vignette) vignette = makeVignette();
  ctx.drawImage(vignette, 0, 0, cvs.width, cvs.height);
  // screen-space
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawJoystick();
  const p = G.p;
  if (p.hurt > 0 || p.hp < 30 || p.warm < 25) {
    const R0 = Math.min(VW, VH) * .35, R1 = Math.max(VW, VH) * .75;
    const a = Math.max(p.hurt / .45 * .45, p.hp < 30 ? .16 + .1 * Math.sin(t * 5) : 0);
    if (a > 0) { const g = ctx.createRadialGradient(VW / 2, VH / 2, R0, VW / 2, VH / 2, R1); g.addColorStop(0, 'rgba(255,60,90,0)'); g.addColorStop(1, `rgba(220,40,80,${a})`); ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH); }
    if (p.warm < 25) { const g = ctx.createRadialGradient(VW / 2, VH / 2, R0, VW / 2, VH / 2, R1); g.addColorStop(0, 'rgba(170,220,255,0)'); g.addColorStop(1, `rgba(170,220,255,${(25 - p.warm) / 25 * .5})`); ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH); }
  }
  if (G.sleep) {
    const st = G.sleep.t, a = st < 1 ? st : Math.max(0, 1 - (st - 1.2));
    ctx.fillStyle = `rgba(30,22,60,${a})`; ctx.fillRect(0, 0, VW, VH);
    if (a > .3) { ctx.globalAlpha = a; ctx.font = '800 34px "Baloo 2", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff7ea'; ctx.fillText('Zzz…', VW / 2, VH / 2); ctx.globalAlpha = 1; }
  }
}
function makeVignette() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256 * VH / VW || 144;
  const x = c.getContext('2d'), g = x.createRadialGradient(c.width / 2, c.height / 2, c.height * .32, c.width / 2, c.height / 2, c.width * .62);
  g.addColorStop(0, 'rgba(61,43,69,0)'); g.addColorStop(1, 'rgba(61,43,69,.38)');
  x.fillStyle = g; x.fillRect(0, 0, c.width, c.height);

}

// ----- placement preview -----
function drawPreview(t) {
  const h = held(); if (!h || G.sleep) return;
  const it = ITEMS[h], tg = target;
  const a = .5 + Math.sin(t * 5) * .12;
  if (tg && tg.kind === 'tile') {
    const hut = tg.act === 'hut', w = hut ? HUT_W : (it.fw || 1), hh = hut ? HUT_H : 1;
    const gx = hut ? (tg.tx - HUT_HW) * T : tg.tx * T, gy = hut ? (tg.ty - HUT_H + 1) * T : tg.ty * T;
    ctx.save(); ctx.setLineDash([6, 5]); ctx.lineDashOffset = -t * 20; ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,255,255,.95)';
    ctx.strokeRect(gx + 2, gy + 2, w * T - 4, hh * T - 4); ctx.restore();
    ctx.globalAlpha = a;
    if (tg.act === 'place') {
      if (it.place === 'block') spr(it.art, tg.tx * T + T / 2, tg.ty * T + T, Object.assign({ e: {} }, it.ao));
      else if (it.place === 'fence') spr('bd.fence', tg.tx * T + T / 2, tg.ty * T + T, { e: {} });
      else spr(it.art, tg.tx * T + (it.fw || 1) * T / 2, tg.ty * T + T, it.ao || {});
    } else if (tg.act === 'floor') { ctx.fillStyle = TCOL[TL.FLOOR][0]; ctx.fillRect(gx, gy, T, T); }
    else if (tg.act === 'till') { ctx.fillStyle = TCOL[TL.SOIL][0]; ctx.fillRect(gx, gy, T, T); }
    else if (tg.act === 'plant') spr(CROPS[it.seed].art, gx + T / 2, gy + T - 4, { stage: 0 });
    else if (tg.act === 'hut') { ctx.fillStyle = TCOL[TL.FLOOR][0]; ctx.fillRect(gx, gy, w * T, hh * T); }
    ctx.globalAlpha = 1;
  } else if (tg && tg.far) {
    const [fx, fy] = aimTile();
    ctx.save(); ctx.setLineDash([5, 5]); ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(230,70,90,.8)'; ctx.strokeRect(fx * T + 3, fy * T + 3, T - 6, T - 6); ctx.restore();
  } else if (it.place === 'hut') {
    // show the whole footprint, with the tiles in the way crossed out
    const [fx, fy] = aimTile() || frontTile();
    ctx.save(); ctx.setLineDash([6, 5]); ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(230,70,90,.75)'; ctx.strokeRect((fx - HUT_HW) * T + 2, (fy - HUT_H + 1) * T + 2, HUT_W * T - 4, HUT_H * T - 4); ctx.setLineDash([]);
    ctx.lineWidth = 3; ctx.strokeStyle = `rgba(230,70,90,${a + .2})`; ctx.beginPath();
    for (const [i, j] of hutBlocked(fx, fy)) { const x = i * T + 14, y = j * T + 14; ctx.moveTo(x, y); ctx.lineTo(x + T - 28, y + T - 28); ctx.moveTo(x + T - 28, y); ctx.lineTo(x, y + T - 28); }
    ctx.stroke(); ctx.restore();
  } else if (usesTile(h)) {
    const [fx, fy] = aimTile() || frontTile();
    ctx.save(); ctx.setLineDash([5, 5]); ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(230,70,90,.8)'; ctx.strokeRect(fx * T + 3, fy * T + 3, T - 6, T - 6); ctx.restore();
  }
}

// ----- lighting with cross-hatched darkness -----
function drawLighting(d, t, cx, cy) {
  const lw = lcvs.width, lh = lcvs.height, k = SC * .5;
  const ox = lw / 2 - cx * k, oy = lh / 2 - cy * k;
  lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.globalCompositeOperation = 'source-over'; lctx.clearRect(0, 0, lw, lh);
  lctx.fillStyle = `rgba(28,20,60,${d})`; lctx.fillRect(0, 0, lw, lh);
  lctx.globalCompositeOperation = 'destination-out';
  const hole = (x, y, r, a) => {
    const sx = ox + x * k, sy = oy + y * k, sr = r * k;
    if (sx < -sr || sy < -sr || sx > lw + sr || sy > lh + sr) return;
    const g = lctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
    g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(.6, `rgba(0,0,0,${a * .78})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    lctx.fillStyle = g; lctx.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
  };
  for (const l of LIGHTS) hole(l.x, l.y, l.r * 1.15 + (l.heat ? Math.sin(t * 9 + l.x) * 4 : 0), l.win ? .5 : 1);
  const p = G.p;
  hole(p.x, p.y - 24, have('lantern') ? 185 : 92, have('lantern') ? .95 : .7);
  if (G.inside) hole(p.x, p.y - 30, 160, .6);
  // hatch the dark (pencil night)
  hctx.setTransform(1, 0, 0, 1, 0, 0); hctx.globalCompositeOperation = 'source-over'; hctx.clearRect(0, 0, lw, lh);
  hctx.fillStyle = K.hatchPattern(hctx, 5, .9, true, 3); hctx.fillRect(0, 0, lw, lh);
  hctx.globalCompositeOperation = 'destination-in'; hctx.drawImage(lcvs, 0, 0);
  ctx.save(); ctx.imageSmoothingEnabled = true;
  ctx.drawImage(lcvs, 0, 0, cvs.width, cvs.height);
  ctx.globalAlpha = .55; ctx.drawImage(hcvs, 0, 0, cvs.width, cvs.height); ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter';
  for (const l of LIGHTS) {
    if (l.win) continue;
    const [sx, sy] = w2s(l.x, l.y), sr = l.r * SC * DPR;
    const g = ctx.createRadialGradient(sx * DPR, sy * DPR, 0, sx * DPR, sy * DPR, sr);
    g.addColorStop(0, `rgba(255,160,70,${.2 * d})`); g.addColorStop(1, 'rgba(255,130,50,0)');
    ctx.fillStyle = g; ctx.fillRect(sx * DPR - sr, sy * DPR - sr, sr * 2, sr * 2);
  }
  ctx.restore();
}
let RAIN = [];
function drawRain(t) {
  if (RAIN.length < 90) for (let i = RAIN.length; i < 90; i++) RAIN.push({ x: Math.random(), y: Math.random(), s: .6 + Math.random() * .6 });
  ctx.strokeStyle = 'rgba(120,150,190,.45)'; ctx.lineWidth = 1.3 * DPR; ctx.beginPath();
  for (const r of RAIN) {
    const y = ((r.y + t * .9 * r.s) % 1) * cvs.height, x = ((r.x + t * .15 * r.s) % 1) * cvs.width;
    ctx.moveTo(x, y); ctx.lineTo(x - 4 * DPR, y + 14 * DPR);
  }
  ctx.stroke();
  ctx.fillStyle = 'rgba(90,110,150,.08)'; ctx.fillRect(0, 0, cvs.width, cvs.height);
}

// ----- floating fx & particles -----
function floatIcon(icon, txt, x, y) { FX.push({ k: 'icon', icon, txt, x, y, life: 0, max: 1.4 }); }
function floatFx(name, x, y) { FX.push({ k: 'fx', name, x, y, life: 0, max: 1.1 }); }
function floatText(txt, x, y) { FX.push({ k: 'text', txt, x, y, life: 0, max: 1.1 }); }
function dust(x, y) { burst(x, y, 6, 'rgba(200,180,150,.9)', 'poof'); }
function burst(x, y, n, col, kind) {
  for (let i = 0; i < n; i++) { const a = Math.random() * TAU, s = 40 + Math.random() * 90; FX.push({ k: 'p', kind, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 50, life: 0, max: .45 + Math.random() * .5, col, sz: kind === 'poof' ? 5 + Math.random() * 5 : kind === 'leaf' ? 4 + Math.random() * 2 : 2.2 + Math.random() * 1.8, rot: Math.random() * TAU }); }
}
function updateFX(dt) {
  for (const f of FX) {
    f.life += dt;
    if (f.k === 'p') { f.x += f.vx * dt; f.y += f.vy * dt; if (f.kind === 'poof' || f.kind === 'star') { f.vx *= .9; f.vy *= .9; } else if (f.kind === 'spark') f.vy -= 30 * dt; else f.vy += 300 * dt; }
  }
  if (FX.length) FX = FX.filter(f => f.life < f.max);
  if (FX.length > 260) FX.splice(0, FX.length - 260);
}
function drawFX() {
  ctx.textBaseline = 'middle';
  for (const f of FX) {
    const p = f.life / f.max, a = p < .7 ? 1 : 1 - (p - .7) / .3;
    ctx.globalAlpha = Math.max(0, a);
    if (f.k === 'p') {
      ctx.fillStyle = f.col;
      if (f.kind === 'leaf') { ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot + f.life * 6); ctx.beginPath(); ctx.ellipse(0, 0, f.sz, f.sz * .55, 0, 0, TAU); ctx.fill(); ctx.restore(); }
      else if (f.kind === 'poof') { ctx.beginPath(); ctx.arc(f.x, f.y, f.sz * (1 + f.life * 2), 0, TAU); ctx.fill(); }
      else if (f.kind === 'star') K.star(ctx, f.x, f.y, f.sz * 1.8, f.col);
      else { ctx.beginPath(); ctx.arc(f.x, f.y, f.sz, 0, TAU); ctx.fill(); }
    } else if (f.k === 'icon') {
      const y = f.y - p * 34;
      K.draw(ctx, f.icon, f.x, y, { scale: .42 });
      if (f.txt) { ctx.font = '800 15px "Baloo 2", system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.lineWidth = 4; ctx.strokeStyle = K.P.ink; ctx.strokeText(f.txt, f.x + 14, y); ctx.fillStyle = '#fff7ea'; ctx.fillText(f.txt, f.x + 14, y); }
    } else if (f.k === 'fx') K.draw(ctx, f.name, f.x, f.y - p * 12, { t: p, scale: 1.2 });
    else { ctx.font = '800 20px "Baloo 2", system-ui, sans-serif'; ctx.textAlign = 'center'; const y = f.y - p * 26; ctx.lineWidth = 5; ctx.strokeStyle = K.P.ink; ctx.strokeText(f.txt, f.x, y); ctx.fillStyle = '#ff8a9a'; ctx.fillText(f.txt, f.x, y); }
  }
  ctx.globalAlpha = 1;
}

// ===== 60-ui: HUD, hotbar, sheet (craft/build/bag), modals, minimap =====
let state = 'title';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let OPTS = { sound: true };
try { Object.assign(OPTS, JSON.parse(localStorage.getItem(OPT_KEY) || '{}')); } catch (e) {}
function saveOpts() { try { localStorage.setItem(OPT_KEY, JSON.stringify(OPTS)); } catch (e) {} }

// ----- icons (icons are drawn by MinikArt; placeables use their own art) -----
const URL_CACHE = {};
function artURL(name, opts) {
  const key = name + JSON.stringify(opts || {});
  if (URL_CACHE[key]) return URL_CACHE[key];
  const d = K.get(name); if (!d) return '';
  const c = document.createElement('canvas'); c.width = c.height = 96;
  const x = c.getContext('2d');
  if (d.tags.includes('icon') || d.tags.includes('fx')) K.draw(x, name, 48, 48, Object.assign({ scale: 1.45, t: .3 }, opts));
  else { const sc = Math.min(84 / d.w, 84 / d.h); K.draw(x, name, 48 + (d.ax - d.w / 2) * sc, 48 + (d.ay - d.h / 2) * sc, Object.assign({ scale: sc, t: .3 }, opts)); }
  return (URL_CACHE[key] = c.toDataURL());
}
function itemURL(k) {
  const it = ITEMS[k]; if (!it) return '';
  if (it.ic) return artURL(it.ic);
  if (it.place === 'block' || it.place === 'fence') return artURL(it.art, Object.assign({ e: {} }, it.ao || {}));
  return artURL(it.art, it.ao || {});
}
const ic = (name, cls) => `<img${cls ? ` class="${cls}"` : ''} src="${artURL(name)}" alt="">`;
const icItem = (k, cls) => `<img${cls ? ` class="${cls}"` : ''} src="${itemURL(k)}" alt="">`;
function applyIcons(root) { (root || document).querySelectorAll('img[data-ic]').forEach(img => { img.src = artURL(img.dataset.ic); }); }

// ----- toasts & banners -----
let QUIET = false;
function toast(msg, icon) {
  if (QUIET || state === 'title') return;
  const w = $('toasts');
  for (const c of w.children) if (c.dataset.m === msg) return;
  const d = document.createElement('div'); d.className = 'toast'; d.dataset.m = msg;
  d.innerHTML = (icon ? ic(icon) : '') + `<span>${esc(msg)}</span>`;
  w.appendChild(d); while (w.children.length > 3) w.firstChild.remove();
  setTimeout(() => d.remove(), 2800);
}
let banT = 0;
function banner(a, b) { $('banT').textContent = a; $('banS').textContent = b || ''; $('banner').classList.add('show'); clearTimeout(banT); banT = setTimeout(() => $('banner').classList.remove('show'), 3000); }

// ----- HUD -----
let hudAll = true;
function hudDirty() { hudAll = true; }
const sig = {};
function once(k, v, fn) { if (sig[k] !== v) { sig[k] = v; fn(v); } }
function updateHUD() {
  const p = G.p;
  once('hp', Math.round(p.hp), v => { $('bHp').style.transform = `scaleX(${v / 100})`; $('sHp').classList.toggle('low', v < 25); });
  once('food', Math.round(p.food), v => { $('bFood').style.transform = `scaleX(${v / 100})`; $('sFood').classList.toggle('low', v < 20); });
  once('warm', Math.round(p.warm), v => { $('bWarm').style.transform = `scaleX(${v / 100})`; $('sWarm').classList.toggle('low', v < 20); });
  once('day', G.day + (G.weather === 'rain' ? ' 🌧' : ''), () => { $('dayL').textContent = `Gün ${G.day}${G.weather === 'rain' ? ' · yağmur' : ''}`; });
  once('time', clockText() + (G.inside ? 'h' : ''), () => { $('timeL').innerHTML = clockText() + (G.inside ? ' · <span class="home">evde</span>' : ''); });
  once('clk', isNight() || G.t > .55 ? 'icon.moon' : 'icon.sun', v => { $('clockIc').src = artURL(v); });
  const qd = QUESTS[G.q];
  const qs = qd ? (() => { const [a, b] = qd.c(G); return `${qd.t}|${Math.min(a, b)}/${b}`; })() : 'done';
  once('quest', qs, () => {
    if (!qd) { $('qT').textContent = 'Tüm görevler tamam!'; $('qP').textContent = 'Diyar senin. Keşfet, kur, ek.'; return; }
    const [a, b] = qd.c(G); $('qT').textContent = qd.t; $('qP').textContent = b > 1 ? `${Math.min(a, b)}/${b}` : 'Görev ' + (G.q + 1) + '/' + QUESTS.length;
  });
  const tg = target;
  const lbl = tg ? tg.label : 'Vur', icn = tg ? tg.ic : 'icon.hand';
  once('act', lbl + icn + (tg && tg.kind === 'tile' ? 1 : 0), () => { $('actL').textContent = lbl; $('actIc').src = artURL(icn); $('actBtn').classList.toggle('place', !!(tg && tg.kind === 'tile')); });
  if (hudAll) {
    hudAll = false;
    renderHotbar();
    $('bagDot').hidden = !RECIPES.some(r => recipeState(r).ok && !ITEMS[r.id].tool) && !RECIPES.some(r => ITEMS[r.id].tool && recipeState(r).ok);
    if (sheetTab) renderSheet();
  }
}
function renderHotbar() {
  const h = $('hotbar');

    const n = k ? have(k) : 0;
    if (k && !n && !ITEMS[k].tool) { G.hot[i] = null; if (G.sel === i) G.sel = -1; return `<button class="slot empty" data-i="${i}"></button>`; }
    return `<button class="slot${G.sel === i ? ' on' : ''}${k ? '' : ' empty'}" data-i="${i}" aria-label="${k ? esc(ITEMS[k].n) : 'Boş'}">${k ? icItem(k) + (ITEMS[k].tool ? '' : `<b>${n}</b>`) : ''}</button>`;
  }).join('');
}
$('hotbar').addEventListener('click', e => { const b = e.target.closest('.slot'); if (!b || !G) return; const i = +b.dataset.i; if (!G.hot[i]) { openSheet('bag'); return; } selectHot(i); renderHotbar(); });

// ----- sheet -----
let sheetTab = null;
function openSheet(tab) { if (!G || state !== 'play') return; sheetTab = tab || 'tool'; $('sheet').hidden = false; $('scrim').hidden = false; renderSheet(); sfx('tap'); }
function closeSheet() { sheetTab = null; $('sheet').hidden = true; $('scrim').hidden = true; }
function renderSheet() {
  $('tabs').innerHTML = CATS.map(([id, n, i]) => `<button data-t="${id}" class="${sheetTab === id ? 'on' : ''}">${ic(i)}${n}</button>`).join('') + `<button class="x" data-close aria-label="Kapat">×</button>`;
  const L = $('list');

    L.innerHTML = keys.length ? keys.map(k => `<button class="it" data-k="${k}">${icItem(k)}<b>${ITEMS[k].tool ? '' : have(k)}</b>${esc(ITEMS[k].n)}</button>`).join('') : '<p style="grid-column:1/-1;margin:6px">Çantan boş. Ağaç kes, taş kır, çimen yol!</p>';
    return;
  }
  L.className = 'list';
  const rs = RECIPES.filter(r => r.cat === sheetTab).map(r => ({ r, s: recipeState(r) }));
  rs.sort((a, b) => (b.s.ok - a.s.ok) || ((a.s.own ? 1 : 0) - (b.s.own ? 1 : 0)));
  L.innerHTML = rs.map(({ r, s }) => {
    const it = ITEMS[r.id];
    const cost = Object.entries(r.cost).map(([k, v]) => `<span class="cost${have(k) < v ? ' miss' : ''}">${icItem(k)}${v}</span>`).join('') + (r.need ? `<span class="cost need${s.need ? ' miss' : ''}">${esc(NEED_NAME[r.need])}</span>` : '');
    return `<div class="rc${s.ok ? '' : ' dim'}">${icItem(r.id, 'ri')}<div><b>${esc(it.n)}${r.n > 1 ? ' ×' + r.n : ''}${have(r.id) && !it.tool ? ` <span style="color:var(--muted);font-size:12px">(${have(r.id)})</span>` : ''}</b><p>${esc(r.d)}</p><div class="costs">${cost}</div></div><button class="mk${s.own ? ' own' : ''}" data-r="${r.id}"${s.ok ? '' : ' disabled'}>${s.ok ? 'Yap' : esc(s.why)}</button></div>`;
  }).join('');
}
$('sheet').addEventListener('click', e => {
  const t = e.target.closest('[data-t]'); if (t) { sheetTab = t.dataset.t; renderSheet(); sfx('tap'); return; }
  if (e.target.closest('[data-close]')) { closeSheet(); return; }
  const m = e.target.closest('.mk'); if (m && !m.disabled) { const id = m.dataset.r; if (craft(id)) { const it = ITEMS[id]; if (it.place) closeSheet(); else renderSheet(); } return; }
  const it = e.target.closest('.it');

  const [hx, hy] = w2s(G.p.x, G.p.y - 20), nearHero = usesTile(held()) && Math.hypot(e.clientX - hx, e.clientY - hy) < AIM_REACH * SC + 12;

/** With a building/farming item in hand, the tapped tile becomes the target; dragging paints a line of them. */

function readInput() {

}

  state = 'play'; paused = false; $('title').hidden = true; showHud(true);
  hudDirty(); for (const k in sig) delete sig[k];
  cam.x = G.p.x; cam.y = G.p.y - 30;
  goFullscreen();
}
function startNew() {
  initAudio();
  chooseCharacter(ch => {
    chunks.clear(); newGame(ch); enterPlay(); save();
    banner('1. Gün', `${SURV[ch].n} sonsuz diyarda uyandı. Pamuk da yanında!`);
    setTimeout(() => toast('İpucu: ağaçlara yaklaş ve turuncu tuşa bas', 'icon.hand'), 1600);
  });
}
function continueGame() {
  const s = readSave(); if (!s) { startNew(); return; }
  initAudio(); chunks.clear(); G = s; G.mobs = []; G.sleep = null; enterPlay();
  banner(`${G.day}. Gün`, 'Kaldığın yerden devam.');
}
function goFullscreen() {
  if (/KivilcimApp/.test(navigator.userAgent)) return;
  try { const el = document.documentElement; if (el.requestFullscreen && !document.fullscreenElement && /Android/i.test(navigator.userAgent)) el.requestFullscreen({ navigationUI: 'hide' }).then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => {}); } catch (e) {}
}
window.minikBack = function () {
  if (sheetTab) { closeSheet(); return true; }
  if (!$('modal').hidden) { closeModal(); paused = false; return true; }
  if (state === 'play') { openMenu(); return true; }
  return false;
};
window.minikPause = function () { if (G && state === 'play') { save(); if ($('modal').hidden) openMenu(); } };
$('newBtn').addEventListener('click', () => { sfx('tap'); startNew(); });
$('contBtn').addEventListener('click', () => { sfx('tap'); continueGame(); });
$('portraitAnyway').addEventListener('click', () => document.body.classList.add('allow-portrait'));
addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (document.hidden) window.minikPause(); });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

// ----- loop -----
let lastT = 0, hudT = 0, perfN = 0, perfSum = 0;
/** First seconds of play: if frames are slow and the player never chose, switch to the light renderer. */
function autoQuality(dt) {
  if (OPTS.lite !== undefined || perfN >= 240) return;
  perfN++; if (perfN > 60) perfSum += dt;
  if (perfN === 240 && perfSum / 180 > 1 / 40) { OPTS.lite = true; saveOpts(); K.clearSprites(); resize(); toast('Oyun akıcı olsun diye grafik hafifletildi (Menü › Grafik)', 'icon.settings'); }
}
function loop(ts) {
  const t = ts / 1000, dt = Math.min(.05, Math.max(0, t - lastT)); lastT = t;
  if (G) {
    if (state === 'play') {
      const blocked = paused || !$('modal').hidden || !!sheetTab;
      if (!blocked) {
        const inp = readInput(), cd0 = G.p.cd;
        simulate(dt, inp);
        if (inp.act && G.p.cd > cd0) input.queued = false;
        // a quick tap releases before the frame that acts on it: keep the tapped tile until then
        if (input.dropAim && !input.queued) { aim = null; input.dropAim = false; }
      }
      const lk = 1 - Math.pow(.003, dt);
      cam.x += (G.p.x - cam.x) * lk; cam.y += (G.p.y - 30 - cam.y) * lk;
      hudT += dt; if (hudT > .1) { hudT = 0; updateHUD(); }
      if (!blocked) autoQuality(dt);
      updateMini(dt);
    } else if (state === 'title') {
      G.cat.t += dt; streamChunks(cam.x, cam.y); collectLights();
      cam.x = T * 2 + Math.sin(t * .1) * 30;
    }
    for (const c of chunks.values()) for (const o of c.objs) if (o.shake > 0) o.shake -= dt;
    cam.shake = Math.max(0, cam.shake - dt * 2.5);
  }
  updateFX(dt);
  render(t);
  requestAnimationFrame(loop);
}
function boot(data) {
  resize(); applyIcons();
  if (document.fonts && document.fonts.load) document.fonts.load('800 16px "Baloo 2"').catch(() => {});
  showTitle();
  if (data && data.G && data.G.v === 1) { chunks.clear(); G = data.G; G.mobs = []; enterPlay(); }
  requestAnimationFrame(loop);
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => (state === 'play' && G) ? { G: Object.assign({}, G, { mobs: [], sleep: null }) } : {}); } catch (e) {}
const HOT = window.claude && window.claude.hot;
if (HOT && HOT.ready) HOT.ready(boot); else boot((HOT && HOT.data) || {});

})();
</script>
