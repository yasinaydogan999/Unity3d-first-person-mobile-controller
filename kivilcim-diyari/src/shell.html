<title>Kıvılcım Diyarı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
:root{
  /* Layout: landscape stage; stats + clock top-left, quest pill top-centre, minimap top-right, joystick bottom-left, hotbar bottom-centre, action cluster bottom-right */
  --ink:#3d2b45; --paper:#fff7ea; --paper-2:#f3e3c4; --card:#fffdf7; --muted:#6b5872;
  --coral:#ff7f5c; --sun:#ffc94a; --leaf:#4fb565; --teal:#5cc0b5; --plum:#8e6fd6; --night:#2a2257;
  --hp:#ff6b7f; --food:#ffae45; --warm:#ff8457;
  --font:"Baloo 2","Arial Rounded MT Bold",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px); --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#efe4cf;color:var(--ink);font-family:var(--font);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#stage{position:fixed;inset:0;display:block;touch-action:none}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.panel{background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink)}
.sketch{background-image:repeating-linear-gradient(-45deg,rgba(61,43,69,.05) 0 1px,transparent 1px 6px)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
#hud .pe{pointer-events:auto}
.tl{position:absolute;top:calc(var(--st) + 6px);left:calc(var(--sl) + 8px);display:flex;gap:6px;align-items:flex-start}
.stats{padding:4px 9px 4px 6px;display:grid;gap:1px}
.stat{display:flex;align-items:center;gap:5px}
.stat img{width:20px;height:20px}
.bar{width:clamp(70px,13vw,120px);height:10px;border-radius:7px;background:#ead9bf;border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;transform-origin:left;transition:transform .2s linear}
#bHp{background:var(--hp)} #bFood{background:var(--food)} #bWarm{background:var(--warm)}
.stat.low{animation:pulse .7s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.clock{display:flex;align-items:center;gap:5px;padding:2px 10px 2px 3px;height:34px;box-sizing:border-box}
.clock img{width:28px;height:28px}
.clock div{display:flex;flex-direction:column;line-height:1}
.clock b{font-size:15px}
.clock span{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.clock .home{font-size:11px;color:#2f8f5e}
#quest{position:absolute;top:calc(var(--st) + 6px);left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:3px 12px 3px 4px;max-width:min(40vw,420px);font-weight:700;font-size:13px;line-height:1.15;text-align:left}
#quest img{width:26px;height:26px;flex:none}
#quest small{display:block;color:var(--muted);font-size:11.5px}
.tr{position:absolute;top:calc(var(--st) + 6px);right:calc(var(--sr) + 8px);display:flex;gap:6px;align-items:flex-start}
#mapWrap{width:92px;height:92px;border-radius:50%;overflow:hidden;padding:0;position:relative}
#mini{width:100%;height:100%;display:block}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.iconbtn img{width:24px;height:24px}
#hotbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 8px);display:flex;gap:4px;padding:4px;border-radius:16px}
.slot{width:46px;height:46px;border-radius:11px;background:#f6ead3;border:2px solid rgba(61,43,69,.35);position:relative;display:grid;place-items:center;box-sizing:border-box}
.slot img{width:36px;height:36px}
.slot b{position:absolute;right:2px;bottom:-1px;font-size:12.5px;font-weight:800;text-shadow:0 0 3px #fff,0 0 3px #fff;font-variant-numeric:tabular-nums}
.slot.on{background:#fff2b8;border-color:var(--ink);box-shadow:0 0 0 3px var(--sun)}
.slot.empty{opacity:.55}
.acts{position:absolute;right:calc(var(--sr) + 12px);bottom:calc(var(--sb) + 12px);display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:8px 10px;align-items:center}
.cbtn{width:58px;height:58px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:11.5px;line-height:1;gap:0;position:relative}
.cbtn img{width:30px;height:30px}
.cbtn .dot{position:absolute;top:-3px;right:-3px;width:15px;height:15px;border-radius:50%;background:var(--leaf);border:2.5px solid var(--ink)}
#bagBtn{grid-column:1;grid-row:1} #eatBtn{grid-column:1;grid-row:2}
#actBtn{grid-column:2;grid-row:1/span 2;width:94px;height:94px;border-radius:50%;background:var(--coral);color:#fff;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;font-weight:800;line-height:1;text-shadow:0 2px 0 rgba(61,43,69,.45)}
#actBtn img{width:40px;height:40px}
#actBtn.place{background:var(--leaf)}
.cbtn:active,#actBtn.down{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#toasts{position:fixed;left:50%;bottom:calc(var(--sb) + 80px);transform:translateX(-50%);z-index:9;display:flex;flex-direction:column-reverse;gap:5px;align-items:center;pointer-events:none;width:max-content;max-width:min(560px,calc(100vw - 400px))}
.toast{background:var(--paper);border:2.5px solid var(--ink);border-radius:13px;padding:3px 12px 3px 5px;font-weight:700;font-size:14px;line-height:1.25;box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;gap:6px;animation:tin .2s ease-out,tout .4s ease-in 2.3s forwards}
.toast img{width:24px;height:24px}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}
#banner{position:fixed;left:16px;right:16px;top:24%;text-align:center;z-index:4;pointer-events:none;opacity:0;transform:translateY(-8px);transition:opacity .35s,transform .35s}
#banner.show{opacity:1;transform:none}
#banner h2{margin:0;font-size:clamp(34px,7vw,58px);line-height:1;font-weight:800;color:var(--paper);text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 7px 0 var(--ink)}
#banner p{display:inline-block;margin:10px 0 0;padding:3px 14px;font-size:15px;font-weight:700;background:rgba(61,43,69,.85);color:var(--paper);border-radius:12px}
/* sheet */
#scrim{position:fixed;inset:0;z-index:6;background:rgba(40,28,60,.35)}
#sheet{position:fixed;z-index:7;top:calc(var(--st) + 6px);bottom:calc(var(--sb) + 6px);right:calc(var(--sr) + 6px);width:min(560px,74vw);display:flex;flex-direction:column;gap:6px;padding:8px 10px;box-sizing:border-box;animation:slin .18s ease-out}
@keyframes slin{from{transform:translateX(24px);opacity:.4}}
.tabs{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.tabs button{display:flex;align-items:center;gap:3px;border:2px solid var(--ink);border-radius:11px;padding:2px 9px 2px 3px;font-weight:800;font-size:13.5px;background:#fff;flex:none}
.tabs button img{width:24px;height:24px}
.tabs button.on{background:var(--sun)}
.tabs .x{margin-left:auto;width:34px;justify-content:center;padding:0;font-size:20px}
.list{overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:5px;touch-action:pan-y;overscroll-behavior:contain;align-content:start;padding-bottom:6px}
.rc{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:6px;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:13px;padding:4px 6px 4px 4px}
.rc.dim{background:#f3ece2}
.rc img.ri{width:42px;height:42px}
.rc b{font-size:14px;line-height:1.05;display:block}
.rc p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.15}
.costs{display:flex;gap:2px;flex-wrap:wrap;margin-top:2px}
.cost{display:inline-flex;align-items:center;font-weight:800;font-size:12px;background:var(--paper-2);border-radius:999px;padding:0 6px 0 0;line-height:20px}
.cost img{width:20px;height:20px}
.cost.miss{background:#ffd4d9;color:#b3263f}
.cost.need{background:#e3dcff;padding-left:7px}
.cost.need.miss{background:#ffd4d9}
.mk{border:2.5px solid var(--ink);border-radius:11px;background:var(--leaf);color:#fff;font-weight:800;font-size:14px;padding:6px 10px;box-shadow:0 3px 0 var(--ink);text-shadow:0 1px 0 rgba(61,43,69,.4)}
.mk:disabled{background:#e4dae3;color:#8a7a8f;box-shadow:none;text-shadow:none;font-size:12px}
.mk.own{background:var(--sun);color:var(--ink);text-shadow:none}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:5px;align-content:start;overflow-y:auto;touch-action:pan-y}
.it{border:2px solid var(--ink);border-radius:12px;background:var(--card);display:flex;flex-direction:column;align-items:center;padding:3px;font-weight:700;font-size:11.5px;line-height:1.1;text-align:center;gap:1px}
.it img{width:38px;height:38px}
.it b{font-size:14px}
/* modal */
#modal{position:fixed;z-index:12;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(var(--st) + 10px) calc(var(--sr) + 12px) calc(var(--sb) + 10px) calc(var(--sl) + 12px);box-sizing:border-box;background:rgba(40,28,60,.5);overflow-y:auto;touch-action:pan-y}
.mbox{width:min(640px,100%);max-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;padding:12px 14px;overflow-y:auto;animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.95);opacity:.3}}
.mbox h2{margin:0;font-size:26px;line-height:1.05}
.mbox h2 small{display:block;font-size:14px;font-weight:600;color:var(--muted)}
.mbox p{margin:0;font-size:15px;line-height:1.35}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:2.5px solid var(--ink);border-radius:13px;background:#fff;font-weight:800;font-size:16px;padding:7px 14px;box-shadow:0 3px 0 var(--ink);display:inline-flex;align-items:center;gap:6px;justify-content:center;line-height:1.1}
.btn img{width:24px;height:24px}
.btn.pri{background:var(--coral);color:#fff;text-shadow:0 1px 0 rgba(61,43,69,.4)}
.btn.ok{background:var(--leaf);color:#fff;text-shadow:0 1px 0 rgba(61,43,69,.4)}
.btn small{display:block;font-size:11.5px;font-weight:600}
.btn:disabled{opacity:.5;box-shadow:none}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.chars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ch{border:2.5px solid var(--ink);border-radius:14px;background:#fff;display:flex;flex-direction:column;align-items:center;padding:4px;gap:1px;font-weight:800;font-size:15px}
.ch canvas{width:84px;height:96px}
.ch small{font-size:11px;font-weight:600;color:var(--muted);text-align:center;line-height:1.15}
.ch.on{background:#fff2b8;box-shadow:0 0 0 3px var(--sun)}
.qlist{display:grid;gap:4px}
.qlist div{display:flex;gap:6px;align-items:center;background:#fff;border-radius:11px;padding:3px 8px 3px 3px;font-size:14px;font-weight:600}
.qlist div img{width:26px;height:26px}
.qlist .done{opacity:.55;text-decoration:line-through}
.trades{display:grid;gap:5px}
.trade{display:flex;align-items:center;justify-content:space-between;gap:6px;border:2.5px solid var(--ink);border-radius:13px;background:#fff;padding:4px 8px;font-weight:800}
.trade .fx{display:flex;gap:3px;align-items:center}
.trade .fx span{display:inline-flex;align-items:center;font-size:13px;border-radius:999px;padding:0 7px 0 0;background:#e6f7d9}
.trade .fx span.neg{background:#ffd4d9}
.trade .fx img{width:22px;height:22px}
/* title */
#title{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:flex-end;padding:calc(var(--st) + 12px) calc(var(--sr) + 18px) calc(var(--sb) + 12px) calc(var(--sl) + 18px);box-sizing:border-box;background:linear-gradient(90deg,rgba(42,34,87,0) 35%,rgba(42,34,87,.4));overflow-y:auto;touch-action:pan-y}
.tcard{width:min(370px,52vw);display:flex;flex-direction:column;gap:8px;padding:12px 14px}
.logo{margin:0;display:flex;flex-direction:column;line-height:.84;font-weight:800;transform:rotate(-2deg)}
.logo span{font-size:clamp(36px,6.4vw,60px);color:var(--coral);text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 7px 0 var(--ink)}
.logo span+span{color:var(--sun);margin-left:.7em}
.tcard p{margin:0;font-size:14px;line-height:1.3;font-weight:600}
.tcard .btn{width:100%;font-size:19px;padding:8px 12px}
#rotate{position:fixed;inset:0;z-index:20;background:var(--night);color:var(--paper);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;box-sizing:border-box}
#rotate img{width:96px;height:96px;animation:rot 2.2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rotate b{font-size:24px}
#rotate button{margin-top:6px;font-size:14px;color:var(--paper);text-decoration:underline}
@media (orientation:portrait) and (max-width:820px){body:not(.allow-portrait) #rotate{display:flex}}
@media (max-height:350px){.slot{width:40px;height:40px}.slot img{width:30px;height:30px}#actBtn{width:82px;height:82px}.cbtn{width:50px;height:50px}#mapWrap{width:76px;height:76px}}
@media (prefers-reduced-motion:reduce){.toast,.mbox,#sheet{animation:none}#rotate img{animation:none}}
</style>
<!--BODY-->
<canvas id="stage" aria-label="Kıvılcım Diyarı oyun alanı"></canvas>
<div id="hud" hidden>
  <div class="tl">
    <div class="stats panel">
      <div class="stat" id="sHp"><img data-ic="icon.heart" alt="Can"><div class="bar"><i id="bHp"></i></div></div>
      <div class="stat" id="sFood"><img data-ic="icon.hunger" alt="Tokluk"><div class="bar"><i id="bFood"></i></div></div>
      <div class="stat" id="sWarm"><img data-ic="icon.warm" alt="Sıcaklık"><div class="bar"><i id="bWarm"></i></div></div>
    </div>
    <div class="clock panel"><img id="clockIc" alt=""><div><b id="dayL">Gün 1</b><span id="timeL">08:00</span></div></div>
  </div>
  <button id="quest" class="panel pe sketch"><img data-ic="icon.quest" alt=""><span><span id="qT"></span><small id="qP"></small></span></button>
  <div class="tr">
    <button class="iconbtn panel pe" id="menuBtn" aria-label="Menü"><img data-ic="icon.settings" alt=""></button>
    <div id="mapWrap" class="panel pe"><canvas id="mini" width="184" height="184"></canvas></div>
  </div>
  <div id="hotbar" class="panel pe"></div>
  <div class="acts pe">
    <button class="cbtn" id="bagBtn"><img data-ic="icon.bag" alt="">Çanta<span class="dot" id="bagDot" hidden></span></button>
    <button class="cbtn" id="eatBtn"><img data-ic="icon.eat" alt="">Ye</button>
    <button id="actBtn"><img id="actIc" alt=""><span id="actL">Vur</span></button>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="banner"><h2 id="banT"></h2><p id="banS"></p></div>
<div id="scrim" hidden></div>
<section id="sheet" class="panel" hidden aria-label="Çanta ve üretim"><div class="tabs" id="tabs"></div><div class="list" id="list"></div></section>
<div id="modal" hidden></div>
<section id="title">
  <div class="tcard panel sketch">
    <h1 class="logo"><span>Kıvılcım</span><span>Diyarı</span></h1>
    <p>Sonsuz, kalemle çizilmiş bir diyar. Ağaç kes, tarla ek, kulübeni kur ya da evini duvar duvar ör. Geceleri ateşini yak, gölgecikler ışıktan korkar.</p>
    <button class="btn ok" id="contBtn" hidden>Devam Et<small id="contInfo"></small></button>
    <button class="btn pri" id="newBtn">Yeni Dünya</button>
  </div>
</section>
<div id="rotate"><img data-ic="icon.phone" alt=""><b>Telefonu yan çevir</b><p>Kıvılcım Diyarı yatay ekranda oynanır.</p><button id="portraitAnyway">Yine de dikey oyna</button></div>
