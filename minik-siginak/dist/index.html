<title>Minik Sığınak</title>
<style>
:root{
  /* Layout: landscape stage; thin top bar, survivor cards down the left over the yard, actions bottom-right; modals float centre */
  --ink:#3d2b45; --paper:#fff7ea; --paper-2:#ffe8c7; --card:#ffffff; --muted:#6b5872;
  --coral:#ff7f5c; --sun:#ffc94a; --leaf:#4fb565; --teal:#5cc0b5; --plum:#8e6fd6; --sky:#7ed0ea; --night:#2a2257;
  --hp:#ff6b7f; --food:#ffae45; --energy:#7fd3c7; --mood:#b9a3ff;
  --font:"Baloo 2","Arial Rounded MT Bold",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#2a2257;color:var(--ink);font-family:var(--font);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#stage{position:fixed;inset:0;display:block;touch-action:none}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.panel{background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink)}
.ic{width:22px;height:22px;display:block;flex:none}

/* top bar */
#top{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:6px;padding:calc(var(--safe-t) + 6px) calc(var(--safe-r) + 8px) 0 calc(var(--safe-l) + 8px);pointer-events:none}
#top > *{pointer-events:auto}
.clock{display:flex;align-items:center;gap:6px;padding:2px 10px 2px 4px;height:36px;box-sizing:border-box;white-space:nowrap}
.clock img{width:28px;height:28px}
.clock div{display:flex;flex-direction:column;line-height:1}
.clock b{font-size:16px;line-height:1}
.clock span{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.05}
.res{display:flex;gap:3px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1;padding:2px;touch-action:pan-x}
.res::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:1px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:0 8px 0 2px;font-weight:800;font-size:14px;line-height:26px;font-variant-numeric:tabular-nums;flex:none}
.chip img{width:24px;height:24px}
.chip.zero{opacity:.45}
.chip.bump{animation:bump .4s ease-out}
@keyframes bump{40%{transform:scale(1.18)}}
.speed{display:flex;gap:3px;padding:2px;height:36px;box-sizing:border-box;align-items:center}
.speed button{width:34px;height:28px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px}
.speed button img{width:22px;height:22px}
.speed button.on{background:var(--sun);box-shadow:inset 0 0 0 2px var(--ink)}
.iconbtn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.iconbtn img{width:24px;height:24px}

/* survivor cards */
#cards{position:fixed;left:calc(var(--safe-l) + 8px);bottom:calc(var(--safe-b) + 8px);z-index:3;display:flex;flex-direction:column;gap:5px;width:146px}
.card{display:grid;grid-template-columns:40px 1fr;gap:5px;align-items:center;padding:3px 6px 3px 3px;text-align:left;position:relative;border-radius:14px}
.card.sel{background:#fff2b8;box-shadow:0 3px 0 var(--ink),0 0 0 3px var(--sun)}
.card.away{opacity:.55}
.card img.pf{width:40px;height:40px;border-radius:11px;background:var(--paper-2)}
.card b{display:block;font-size:14px;line-height:1.05}
.card .st{display:block;font-size:11px;font-weight:700;color:var(--muted);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:2px}
.bars i{display:block;height:5px;border-radius:3px;background:#ead9c2;overflow:hidden;position:relative}
.bars i::after{content:"";position:absolute;inset:0;transform-origin:left;transform:scaleX(var(--v,1));background:var(--c)}
.card .alert{position:absolute;right:-6px;top:-6px;width:22px;height:22px}

/* bottom-right actions */
#acts{position:fixed;right:calc(var(--safe-r) + 10px);bottom:calc(var(--safe-b) + 10px);z-index:3;display:flex;gap:8px;align-items:flex-end}
.big{min-width:64px;height:58px;border-radius:18px;background:var(--paper);border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;line-height:1;padding:0 8px;gap:1px}
.big img{width:30px;height:30px}
.big.hot{background:var(--coral);color:#fff;text-shadow:0 1px 0 rgba(61,43,69,.4)}
.big.night{background:#5d4fb0;color:#fff}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

.act{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:6px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:3px 8px 3px 3px;font-weight:800;font-size:14px;text-align:left;box-shadow:0 2px 0 var(--ink)}
.act img{width:30px;height:30px}
.act small{font-weight:700;font-size:11px;color:var(--muted);display:flex;gap:2px;align-items:center}

.act.go{background:#e6f7d9}

#scrim{position:fixed;inset:0;z-index:6;background:rgba(32,22,60,.45)}

.sheet-h{display:flex;align-items:center;gap:8px}
.sheet-h h3{margin:0;font-size:22px;line-height:1;flex:1}
.sheet-h small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.x{width:38px;height:38px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;font-size:22px;font-weight:800;line-height:1;box-shadow:0 3px 0 var(--ink)}
.list{overflow-y:auto;display:grid;gap:6px;touch-action:pan-y;overscroll-behavior:contain;padding:2px 2px 6px}
.rc{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:5px 8px 5px 5px}
.rc.lock{background:#f3ece4}
.rc img.ri{width:44px;height:44px}
.rc b{font-size:15px;line-height:1.1;display:block}
.rc p{margin:1px 0 0;font-size:12px;color:var(--muted);line-height:1.2}
.costs{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.cost{display:inline-flex;align-items:center;font-weight:800;font-size:12.5px;background:var(--paper-2);border-radius:999px;padding:0 7px 0 1px;line-height:20px}
.cost img{width:20px;height:20px}
.cost.miss{background:#ffd4d9;color:#b3263f}
.cost.t{background:#e9e4ff}
.mk{border:2.5px solid var(--ink);border-radius:12px;background:var(--leaf);color:#fff;font-weight:800;font-size:15px;padding:7px 12px;box-shadow:0 3px 0 var(--ink);text-shadow:0 1px 0 rgba(61,43,69,.4)}
.mk:disabled{background:#e4dae3;color:#8a7a8f;box-shadow:none;text-shadow:none}
.mk.own{background:var(--sun);color:var(--ink);text-shadow:none}

#modal{position:fixed;z-index:8;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(var(--safe-t) + 10px) calc(var(--safe-r) + 12px) calc(var(--safe-b) + 10px) calc(var(--safe-l) + 12px);box-sizing:border-box;background:rgba(32,22,60,.55);overflow-y:auto;touch-action:pan-y}
#modal.clear{background:transparent;pointer-events:none}
#modal.clear > *{pointer-events:auto}
.mbox{width:min(640px,100%);max-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;padding:12px 14px;animation:pop .22s ease-out;overflow-y:auto}
@keyframes pop{from{transform:scale(.94);opacity:.3}}
.mbox h2{margin:0;font-size:26px;line-height:1.05;text-wrap:balance}
.mbox h2 small{display:block;font-size:14px;font-weight:600;color:var(--muted)}
.mbox p{margin:0;font-size:15px;line-height:1.35;text-wrap:pretty}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:2.5px solid var(--ink);border-radius:14px;background:#fff;font-weight:800;font-size:16px;padding:8px 14px;box-shadow:0 3px 0 var(--ink);display:inline-flex;align-items:center;gap:6px;justify-content:center;line-height:1.1}
.btn img{width:24px;height:24px}
.btn.pri{background:var(--coral);color:#fff;text-shadow:0 1px 0 rgba(61,43,69,.4)}
.btn.ok{background:var(--leaf);color:#fff;text-shadow:0 1px 0 rgba(61,43,69,.4)}
.btn.nt{background:#5d4fb0;color:#fff}
.btn:disabled{opacity:.5;box-shadow:none}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn small{display:block;font-size:11.5px;font-weight:600;opacity:.9}
.split{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:start}
.split canvas{width:150px;height:150px;border-radius:14px;background:var(--paper-2);border:2px solid var(--ink)}
.choices{display:grid;gap:6px}
.choice{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;text-align:left;border:2.5px solid var(--ink);border-radius:14px;background:#fff;padding:6px 10px;font-weight:800;font-size:15px;box-shadow:0 3px 0 var(--ink)}
.choice:disabled{opacity:.45;box-shadow:none}
.fx{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.fx span{display:inline-flex;align-items:center;font-size:12px;font-weight:800;border-radius:999px;padding:0 7px 0 1px;line-height:20px;background:#e6f7d9}
.fx span.neg{background:#ffd4d9;color:#b3263f}
.fx span img{width:20px;height:20px}
.plan{display:grid;gap:6px;align-content:start}
.mbox.wide{width:min(980px,100%)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:start}
.cols > div{display:grid;gap:6px;min-width:0}
@media (max-width:640px){.cols{grid-template-columns:1fr}}
.prow{display:grid;grid-template-columns:40px 74px minmax(0,1fr);gap:8px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:4px 8px 4px 4px}
.prow img.pf{width:40px;height:40px;border-radius:12px;background:var(--paper-2)}
.prow b{font-size:15px;display:block;line-height:1.05}
.prow small{font-size:11px;color:var(--muted);font-weight:700;display:block;line-height:1.1}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:2px solid var(--ink);border-radius:11px;background:#fff;font-weight:800;font-size:13px;padding:2px 8px 2px 3px;display:flex;align-items:center;gap:3px}
.seg button img{width:22px;height:22px}
.seg button.on{background:var(--sun)}
.seg button.on.scav{background:#ffb48f}
.seg button.on.guard{background:#c9f0e9}
.seg button:disabled{opacity:.4}
.locs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.loc{border:2.5px solid var(--ink);border-radius:14px;background:#fff;padding:4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:800;font-size:14px;line-height:1.1}
.loc canvas{width:84px;height:52px}
.loc small{font-size:11px;color:var(--muted);font-weight:700;display:flex;gap:1px;align-items:center}
.loc small img{width:16px;height:16px}
.loc.on{background:#fff2b8;box-shadow:0 0 0 3px var(--sun)}
.loc .dg{color:#c0563b}
.rep{display:grid;gap:4px}
.rep div{display:flex;gap:6px;align-items:center;font-size:14.5px;font-weight:600;line-height:1.25;background:#fff;border-radius:12px;padding:3px 8px 3px 3px}
.rep div img{width:28px;height:28px;flex:none}
.rep div.bad{background:#ffe3e7}
.rep div.good{background:#e6f7d9}

#toasts{position:fixed;left:50%;top:calc(var(--safe-t) + 84px);transform:translateX(-50%);z-index:9;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:4px 12px;font-weight:700;font-size:14.5px;line-height:1.25;box-shadow:0 3px 0 var(--ink);text-align:center;animation:tin .2s ease-out,tout .4s ease-in 2.2s forwards;display:flex;align-items:center;gap:6px}
.toast img{width:22px;height:22px}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}

/* scavenging HUD */
#scav{position:fixed;top:calc(var(--safe-t) + 6px);left:calc(var(--safe-l) + 8px);right:calc(var(--safe-r) + 8px);z-index:3;display:flex;gap:8px;align-items:center;pointer-events:none}
#scav > *{pointer-events:auto}
.timer{flex:1;height:36px;display:flex;align-items:center;gap:6px;padding:0 10px 0 4px;box-sizing:border-box;min-width:120px}
.timer img{width:26px;height:26px}
.tbar{flex:1;height:12px;border-radius:8px;background:#3b3478;border:2px solid var(--ink);overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#8e6fd6,#ffb48f,#ffc94a);transform-origin:left}
.bag{display:flex;gap:3px;padding:3px 6px;align-items:center}
.slot{width:28px;height:28px;border-radius:8px;background:#efe2cf;border:2px solid rgba(61,43,69,.35);box-sizing:border-box;display:grid;place-items:center}
.slot img{width:24px;height:24px}
.slot.f{background:#fff;border-color:var(--ink)}

/* title & rotate */
#title{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:flex-end;padding:calc(var(--safe-t) + 12px) calc(var(--safe-r) + 18px) calc(var(--safe-b) + 12px) calc(var(--safe-l) + 18px);box-sizing:border-box;background:linear-gradient(90deg,rgba(42,34,87,0) 30%,rgba(42,34,87,.55));overflow-y:auto;touch-action:pan-y}
.tcard{width:min(360px,48vw);display:flex;flex-direction:column;gap:8px;padding:12px 14px}
.logo{margin:0;display:flex;flex-direction:column;line-height:.82;font-weight:800;transform:rotate(-2deg)}
.logo span{font-size:clamp(34px,6.4vw,58px);color:var(--coral);text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 7px 0 var(--ink)}
.logo span+span{color:var(--sun);margin-left:.8em}
.tcard p{margin:0;font-size:14px;line-height:1.3;font-weight:600;text-wrap:pretty}
.tcard .btn{width:100%;font-size:19px;padding:9px 12px}
.tcard .best{font-size:12.5px;color:var(--muted);font-weight:700;text-align:center}
.tcard .best:empty{display:none}
#rotate{position:fixed;inset:0;z-index:20;background:var(--night);color:var(--paper);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;box-sizing:border-box}
#rotate img{width:96px;height:96px;animation:rot 2.2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rotate b{font-size:24px}
#rotate p{margin:0;font-size:15px;max-width:300px;font-weight:600}
#rotate button{margin-top:6px;font-size:14px;color:var(--paper);text-decoration:underline}
@media (orientation:portrait) and (max-width:820px){ body:not(.allow-portrait) #rotate{display:flex} }
@media (max-height:340px){ .card{grid-template-columns:32px 1fr} .card img.pf{width:32px;height:32px} #cards{width:132px;gap:3px} .big{height:50px} .big img{width:26px;height:26px} }
@media (prefers-reduced-motion:reduce){ .toast,.sheet,.mbox,.chip.bump{animation:none} #rotate img{animation:none} }
</style>

<canvas id="stage" aria-label="Minik Sığınak oyun alanı"></canvas>

<div id="top" hidden>
  <div class="clock panel"><img id="clockIc" alt=""><div><b id="dayLbl">Gün 1</b><span id="timeLbl">06:00</span></div></div>

  <div class="speed panel" id="speed">
    <button data-s="0" aria-label="Duraklat"><img data-ic="icon.pause" alt=""></button>
    <button data-s="1" class="on" aria-label="Normal hız">1×</button>
    <button data-s="2" aria-label="2 kat hız">2×</button>
    <button data-s="3" aria-label="3 kat hız">3×</button>
  </div>
  <button class="iconbtn panel" id="menuBtn" aria-label="Menü"><img data-ic="icon.settings" alt=""></button>
</div>

<div id="cards" hidden></div>
<div id="acts" hidden>
  <button class="big night" id="nightBtn" hidden><img data-ic="icon.moon" alt="">Geceye geç</button>
  <button class="big hot" id="craftBtn"><img data-ic="icon.hammer" alt="">Üret<span class="dot" id="craftDot" hidden></span></button>
</div>
<div id="hint" aria-live="polite"></div>
<div id="bubble" class="panel" hidden></div>

<div id="scav" hidden>
  <div class="timer panel"><img data-ic="icon.moon" alt=""><div class="tbar"><i id="tbar"></i></div><img data-ic="icon.sun" alt=""></div>
  <div class="bag panel" id="bag"></div>
  <button class="btn ok" id="homeBtn"><img data-ic="icon.home" alt="">Eve dön</button>
</div>

<div id="scrim" hidden></div>
<section id="craft" class="sheet panel" hidden aria-label="Üretim">

<div id="modal" hidden></div>

  </div>
</section>

<div id="rotate"><img data-ic="icon.phone" alt=""><b>Telefonu yan çevir</b><p>Minik Sığınak yatay ekranda oynanır.</p><button id="portraitAnyway">Yine de dikey oyna</button></div>
<script>
/* ---- ../minik-art/core.js ---- */
/*
 * MinikArt — an original, reusable vector art kit for cute 2.5D canvas games.
 * Everything is drawn in code (no images), so assets scale to any resolution
 * and can be exported to PNG sprite sheets (see tools/export-assets.mjs).
 *
 * Usage:
 *   MinikArt.draw(ctx, 'st.bed', x, y, {used: true, t: seconds, scale: 1, flip: false});
 *   MinikArt.toCanvas('char.ece', {pose: 'walk', t: 0.2}, 2)  -> HTMLCanvasElement
 *
 * Conventions (see art/STYLE.md):
 *   - 1 art unit = 1 px at scale 1. Interior room height (floor to ceiling) = 130.
 *   - Each asset draws around its ANCHOR at (0,0). Most props: bottom-centre on the floor.
 *   - Positive y is down, so standing things are drawn at negative y.
 *   - Outline colour P.ink, line width LW, round joins. Flat fills + one highlight.
 */
(function (root) {
  'use strict';
  const TAU = Math.PI * 2;
  const P = {
    ink: '#3d2b45', inkSoft: 'rgba(61,43,69,.35)', shadow: 'rgba(61,43,69,.2)',
    cream: '#fff7ea', paper: '#ffe8c7', white: '#ffffff',
    coral: '#ff7f5c', coralDark: '#e8623f', sun: '#ffc94a', sunLight: '#ffe08a',
    leaf: '#5fbf6e', leafDark: '#4a9f59', leafLight: '#93dc89',
    mint: '#7fd3c7', teal: '#5cc0b5', tealDark: '#2f6f69',
    sky: '#7ed0ea', skyDeep: '#4f9de0', skyNight: '#2a2257', skyDusk: '#ff9f80',
    lilac: '#b9a3ff', plum: '#8e6fd6', plumDark: '#5c3f8e',
    pink: '#f59cc4', rose: '#ff6b8b', berry: '#ff4f74', blush: 'rgba(255,120,140,.55)',
    wood: '#c98a5d', woodDark: '#a7704f', woodLight: '#eaae73', woodDeep: '#8a5a3c',
    metal: '#a9b3d6', metalDark: '#7d86ab', metalLight: '#d9def0',
    stone: '#bdb8d6', stoneLight: '#e2def2', stoneDark: '#9a94b8',
    snow: '#f4f8ff', snowShade: '#d6e3f5', ice: '#bfe8f7',
    glass: '#bfe8f7', glassNight: '#3b3478',
    fire1: '#ff6b3d', fire2: '#ffa53d', fire3: '#fff09a', glow: '#ffd98a',
    skin1: '#ffdcc0', skin2: '#f2c09a', skin3: '#c98e66', skin4: '#8d5a3c',
    hairBrown: '#7a4b35', hairBlack: '#3a2c3f', hairBlond: '#f2c45c', hairRed: '#d9673f', hairPink: '#f08fb0',
  };
  const OL = P.ink;
  const LW = 2.5;
  const reg = new Map();
  const warned = new Set();

  // ---------- registry ----------
  function define(name, def) {
    if (!name || typeof def.draw !== 'function') throw new Error('MinikArt.define: bad asset ' + name);
    const d = {
      name,
      w: def.w || 64, h: def.h || 64,
      ax: def.ax != null ? def.ax : (def.w || 64) / 2,
      ay: def.ay != null ? def.ay : (def.h || 64),
      tags: def.tags || [],
      states: def.states || {},
      defaults: def.defaults || {},
      desc: def.desc || '',
      draw: def.draw,
    };
    reg.set(name, d);
    return d;
  }
  function has(name) { return reg.has(name); }
  function get(name) { return reg.get(name); }
  function list(prefix) { return [...reg.keys()].filter(k => !prefix || k.startsWith(prefix)).sort(); }

  function missing(ctx, name, x, y) {
    if (!warned.has(name)) { warned.add(name); if (root.console) console.warn('MinikArt: missing asset', name); }
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = 'rgba(255,0,170,.5)'; ctx.fillRect(-16, -32, 32, 32);
    ctx.restore();
  }

  /** Draw asset `name` with its anchor at (x, y). opts: scale, flip, alpha, t, plus asset states. */
  function draw(ctx, name, x, y, opts) {
    const d = reg.get(name);
    if (!d) { missing(ctx, name, x, y); return false; }
    const o = opts ? Object.assign({}, d.defaults, opts) : Object.assign({}, d.defaults);
    if (o.t == null) o.t = 0;
    ctx.save();
    ctx.translate(x, y);
    const s = o.scale || 1, f = o.flip ? -1 : 1;
    if (s !== 1 || f !== 1) ctx.scale(s * f, s);
    if (o.alpha != null) ctx.globalAlpha *= o.alpha;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    try { d.draw(ctx, o); } catch (e) { if (!warned.has(name + '!')) { warned.add(name + '!'); console.error('MinikArt draw error', name, e); } }
    ctx.restore();
    return true;
  }

  /** Render one asset to a new canvas (for sprite caching / PNG export). */
  function toCanvas(name, opts, scale, pad) {
    const d = reg.get(name); if (!d) return null;
    scale = scale || 1; pad = pad == null ? 6 : pad;
    const o = Object.assign({}, opts || {});
    const W = o.w != null && d.tags.includes('sized') ? o.w : d.w;
    const H = o.h != null && d.tags.includes('sized') ? o.h : d.h;
    const ax = d.tags.includes('sized') ? 0 : d.ax, ay = d.tags.includes('sized') ? 0 : d.ay;
    const c = document.createElement('canvas');
    c.width = Math.ceil((W + pad * 2) * scale); c.height = Math.ceil((H + pad * 2) * scale);
    const cx = c.getContext('2d');
    cx.scale(scale, scale);
    draw(cx, name, ax + pad, ay + pad, Object.assign({}, o, { scale: 1, flip: false }));
    cx.setTransform(1, 0, 0, 1, 0, 0);
    return c;
  }

  // ---------- helpers (all take ctx first) ----------
  function rr(ctx, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  /** Rounded rect, filled, with ink outline (lw 0 = no outline). */
  function orr(ctx, x, y, w, h, r, fill, lw) {
    rr(ctx, x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (lw !== 0) { ctx.lineWidth = lw || LW; ctx.strokeStyle = OL; ctx.stroke(); }
  }
  function circ(ctx, x, y, r, fill, lw) {

// --- reachability graph (cached per site version) ---
const graphCache = new WeakMap();
function graph(s) {
  const hit = graphCache.get(s);
  if (hit && hit.ver === s.ver) return hit;
  const rows = [];
  for (let r = 0; r < s.rows; r++) {
    const segs = []; let start = null;
    for (let c = 0; c < s.cols; c++) {
      const open = s.rooms[r][c].rubble <= 0;
      if (open && start === null) start = c;
      if (!open && start !== null) { segs.push([start * ROOM_W, c * ROOM_W]); start = null; }
    }
    if (start !== null) segs.push([start * ROOM_W, s.cols * ROOM_W]);
    rows.push(segs);
  }
  const g = { ver: s.ver, rows };
  graphCache.set(s, g);

}
function segIndex(g, row, x) {
  const segs = g.rows[row]; if (!segs) return -1;
  for (let i = 0; i < segs.length; i++) if (x >= segs[i][0] - 2 && x <= segs[i][1] + 2) return i;
  return -1;
}
function walkable(s, row, x) { return segIndex(graph(s), row, x) >= 0; }

/** Steps from a position to a target: [{t:'walk',row,x},{t:'climb',x,to}...], or null if unreachable. */
function planPath(s, from, to) {
  const g = graph(s);
  const a = segIndex(g, from.row, from.x), b = segIndex(g, to.row, to.x);
  if (a < 0 || b < 0) return null;
  const key = (r, i) => r * 100 + i;
  const start = key(from.row, a), goal = key(to.row, b);
  const prev = new Map([[start, null]]);
  const q = [[from.row, a]];
  while (q.length) {
    const [r, i] = q.shift();
    if (key(r, i) === goal) break;
    for (const l of s.ladders) {
      let nr = -1;
      if (l.low === r) nr = l.high; else if (l.high === r) nr = l.low; else continue;
      if (segIndex(g, r, l.x) !== i) continue;
      const ni = segIndex(g, nr, l.x); if (ni < 0) continue;
      const k = key(nr, ni); if (prev.has(k)) continue;
      prev.set(k, { r, i, ladder: l, nr }); q.push([nr, ni]);
    }
  }
  if (!prev.has(goal)) return null;
  const hops = [];
  for (let k = goal; prev.get(k); ) { const p = prev.get(k); hops.unshift(p); k = key(p.r, p.i); }
  const steps = [];
  for (const h of hops) { steps.push({ t: 'walk', row: h.r, x: h.ladder.x }); steps.push({ t: 'climb', x: h.ladder.x, to: h.nr }); }
  steps.push({ t: 'walk', row: to.row, x: clampSeg(g, to.row, b, to.x) });

}
function clampSeg(g, row, i, x) { const sg = g.rows[row][i]; return Math.max(sg[0] + 12, Math.min(sg[1] - 12, x)); }

/** Reveal rooms reachable from the entrance, plus rubble rooms next to them. */
function updateReveal(s) {
  const g = graph(s);
  const startSeg = segIndex(g, s.door.row, s.door.x);
  const reach = new Set();
  if (startSeg >= 0) {
    const q = [[s.door.row, startSeg]]; reach.add(s.door.row * 100 + startSeg);
    while (q.length) {
      const [r, i] = q.shift();
      for (const l of s.ladders) {
        let nr = -1; if (l.low === r) nr = l.high; else if (l.high === r) nr = l.low; else continue;
        if (segIndex(g, r, l.x) !== i) continue;
        const ni = segIndex(g, nr, l.x); if (ni < 0) continue;
        const k = nr * 100 + ni; if (reach.has(k)) continue; reach.add(k); q.push([nr, ni]);
      }
    }
  }
  let newly = 0;
  for (let r = 0; r < s.rows; r++) for (let c = 0; c < s.cols; c++) {
    const room = s.rooms[r][c];
    const cx = c * ROOM_W + ROOM_W / 2;
    let vis = false;
    const i = segIndex(g, r, cx);
    if (room.rubble <= 0 && i >= 0 && reach.has(r * 100 + i)) vis = true;
    if (room.rubble > 0) {
      for (const dc of [-1, 1]) {
        const nc = c + dc; if (nc < 0 || nc >= s.cols) continue;
        const nb = s.rooms[r][nc]; if (nb.rubble > 0) continue;
        const ni = segIndex(g, r, nc * ROOM_W + ROOM_W / 2);
        if (ni >= 0 && reach.has(r * 100 + ni)) vis = true;
      }
    }
    if (vis && !room.revealed) { room.revealed = true; newly++; }
  }
  return newly;
}

/** Where to stand to dig into a rubble room, reachable from `from`. */
function rubbleStand(s, room, from) {
  let best = null, bestLen = 1e9;
  for (const dc of [-1, 1]) {
    const nc = room.c + dc; if (nc < 0 || nc >= s.cols) continue;
    if (s.rooms[room.r][nc].rubble > 0) continue;
    const x = dc < 0 ? room.c * ROOM_W - 18 : (room.c + 1) * ROOM_W + 18;
    const p = planPath(s, from, { row: room.r, x });
    if (!p) continue;
    const len = pathLen(from, p);
    if (len < bestLen) { bestLen = len; best = { row: room.r, x, face: dc < 0 ? 1 : -1 }; }
  }

}
function pathLen(from, steps) {

  for (const st of steps) { if (st.t === 'walk') { len += Math.abs(st.x - x); x = st.x; } else len += ROOM_H + SLAB; }
  return len;
}

/** Find a free spot for a new station of width w, preferring near (row,x). */
function findSlot(s, w, near) {
  const g = graph(s);
  let best = null, bestScore = 1e9;
  for (let r = 0; r < s.rows; r++) for (let c = 0; c < s.cols; c++) {
    const room = s.rooms[r][c];
    if (room.rubble > 0 || !room.revealed) continue;
    if (segIndex(g, r, c * ROOM_W + ROOM_W / 2) < 0) continue;
    const L = c * ROOM_W + 8, R = (c + 1) * ROOM_W - 8;
    const occ = [];
    for (const o of s.objs) if (o.row === r && o.x + o.w / 2 > L && o.x - o.w / 2 < R) occ.push([o.x - o.w / 2 - 6, o.x + o.w / 2 + 6]);
    for (const l of s.ladders) if (l.low === r || l.high === r) occ.push([l.x - 26, l.x + 26]);
    if (s.door.row === r) occ.push([s.door.x - 32, s.door.x + 32]);
    occ.sort((a, b) => a[0] - b[0]);
    let cur = L;
    const free = [];
    for (const [a, b] of occ) { if (a > cur) free.push([cur, a]); cur = Math.max(cur, b); }
    if (cur < R) free.push([cur, R]);
    for (const [a, b] of free) {
      if (b - a < w) continue;
      const x = Math.max(a + w / 2, Math.min(b - w / 2, near.x));
      const score = Math.abs(r - near.row) * 500 + Math.abs(x - near.x);
      if (score < bestScore) { bestScore = score; best = { row: r, x }; }
    }
  }
  return best;
}

// --- places for night scavenging ---
function buildPlace(loc, pool, seed, hasAid) {
  const rnd = K.rng(seed);
  const s = { kind: 'place', locId: loc.id, cols: 3, rows: 2, rooms: [], ladders: [], door: { row: 1, x: 34 }, objs: [], nid: 1, ver: 0 };
  const ladderCol = 1 + (rnd() < .5 ? 0 : 1);
  s.ladders.push({ low: 1, high: 0, x: ladderCol * ROOM_W + (rnd() < .5 ? 40 : 180) });
  const rubbleAt = rnd() < .45 ? [rnd() < .5 ? 0 : 1, rnd() < .5 ? 0 : 2] : null;
  for (let r = 0; r < 2; r++) {
    const row = [];
    for (let c = 0; c < 3; c++) {
      const st = loc.walls[(r + c) % loc.walls.length];
      const col = loc.wallColor[(r * 3 + c) % loc.wallColor.length];
      let rub = 0;
      if (rubbleAt && rubbleAt[0] === r && rubbleAt[1] === c && !(r === 1 && c === 0) && Math.floor(s.ladders[0].x / ROOM_W) !== c) rub = 2;
      row.push({ r, c, style: st, color: col, rubble: rub, rubbleMax: rub, revealed: true, bulb: false, hole: rnd() < .2, seed: Math.floor(rnd() * 999), decor: [] });
    }
    s.rooms.push(row);
  }
  // decor + containers
  const contTypes = loc.props.map(p => Object.keys(CONT_ART).find(k => CONT_ART[k] === p)).filter(Boolean);
  if (!contTypes.length) contTypes.push('crate');
  const decorArts = loc.props.filter(p => DECOR_PLACE[p]);
  const conts = [];
  for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) {
    const room = s.rooms[r][c];
    if (rnd() < .55) room.decor.push({ a: 'st.window', x: 40 + rnd() * 140, y: 76 });
    if (decorArts.length && rnd() < .6) { const a = decorArts[Math.floor(rnd() * decorArts.length)]; room.decor.push({ a, x: 60 + rnd() * 100, y: DECOR_PLACE[a].wall ? DECOR_PLACE[a].y : 0, floor: !DECOR_PLACE[a].wall }); }
    const n = (r === 1 && c === 0) ? 1 : 1 + (rnd() < .6 ? 1 : 0);
    const used = [];
    if (r === 1 && c === 0) used.push([0, 70]);
    for (const l of s.ladders) if (Math.floor(l.x / ROOM_W) === c) used.push([l.x - c * ROOM_W - 28, l.x - c * ROOM_W + 28]);
    for (let k = 0; k < n; k++) {
      const t = rnd() < .3 ? 'lootpile' : contTypes[Math.floor(rnd() * contTypes.length)];
      const w = CONT_W[t];
      for (let tries = 0; tries < 8; tries++) {
        const lx = 12 + w / 2 + rnd() * (ROOM_W - 24 - w);
        if (used.some(([a, b]) => lx + w / 2 > a && lx - w / 2 < b)) continue;
        used.push([lx - w / 2 - 6, lx + w / 2 + 6]);
        const o = { id: s.nid++, t, kind: 'mixed', row: r, x: c * ROOM_W + lx, w, loot: {}, locked: false, searched: false };
        s.objs.push(o); conts.push(o); break;
      }
    }
  }
  // distribute loot from the place's remaining pool
  const bag = [];
  for (const k in pool) for (let i = 0; i < pool[k]; i++) bag.push(k);
  for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
  const total = Math.min(bag.length, 9 + Math.floor(rnd() * 5));
  let bi = 0;
  for (let i = 0; i < conts.length && bi < total; i++) {
    const n = 1 + Math.floor(rnd() * 3);
    for (let k = 0; k < n && bi < total; k++) { const it = bag[bi++]; conts[i].loot[it] = (conts[i].loot[it] || 0) + 1; }
  }
  for (let i = 0; bi < total && conts.length; i = (i + 1) % conts.length) { const it = bag[bi++]; conts[i].loot[it] = (conts[i].loot[it] || 0) + 1; }
  // lootpile kinds follow their contents; one cabinet/crate gets locked with a bonus
  for (const o of conts) {
    if (o.t === 'lootpile') { const ks = Object.keys(o.loot); o.kind = ks.length === 1 ? (ks[0] === 'wood' ? 'wood' : ks[0] === 'parts' ? 'parts' : ks[0] === 'cloth' ? 'cloth' : (ks[0] === 'food' || ks[0] === 'cocoa' || ks[0] === 'water') ? 'food' : 'mixed') : 'mixed'; }
    if (!Object.keys(o.loot).length) o.searched = true;
  }
  const lockable = conts.filter(o => (o.t === 'cabinet' || o.t === 'crate') && !o.searched);
  if (lockable.length && rnd() < .7) { const o = lockable[Math.floor(rnd() * lockable.length)]; o.locked = true; const bonus = Object.keys(pool)[0]; o.loot[bonus] = (o.loot[bonus] || 0) + 2; }
  if (hasAid) { const o = { id: s.nid++, t: 'crate', kind: 'mixed', row: 0, x: 2 * ROOM_W + 110, w: 44, loot: { food: 3, meal: 2, meds: 1 }, locked: false, searched: false, aid: true }; s.objs.push(o); }
  return s;
}

// ===== 20-sim: game state, survivors, tasks, day/night, events =====

function mkChar(id, row, x) {

// ----- helpers -----
function homeChars() { return G.chars.filter(c => !c.away); }
function hasStation(kind) { return G.home.objs.some(o => o.t === 'station' && o.kind === kind); }

function canPay(cost) { for (const k in cost) if ((G.inv[k] || 0) < cost[k]) return false; return true; }
function pay(cost) { for (const k in cost) G.inv[k] -= cost[k]; hudDirty(); }
function refund(cost) { if (!cost) return; for (const k in cost) G.inv[k] += cost[k]; hudDirty(); }
function gain(k, n, wx, wy) {
  if (!n) return; G.inv[k] = Math.max(0, (G.inv[k] || 0) + n); hudDirty(k);
  if (wx != null) floatIcon(ITEMS[k].icon, (n > 0 ? '+' : '') + n, wx, wy);

function charY(ch) {
  if (ch.path && ch.path[0] && ch.path[0].t === 'climb') { const st = ch.path[0]; return floorY(ch.row) + (floorY(st.to) - floorY(ch.row)) * ch.climbP; }

// ----- tasks -----
const TASK_POSE = { clear: 'work', craft: 'work', cook: 'work', cocoa: 'work', melt: 'work', collect: 'search', plant: 'search', water_garden: 'search', harvest: 'search', search: 'search', relax: 'sit', nap: 'sleep', pet: 'happy', eat: 'eat', meds: 'eat', warm: 'idle', walk: 'idle', wander: 'idle' };
const TASK_NAME = { clear: 'Moloz temizliyor', craft: 'Üretiyor', cook: 'Yemek pişiriyor', cocoa: 'Kakao yapıyor', melt: 'Kar eritiyor', collect: 'Su alıyor', plant: 'Tohum ekiyor', water_garden: 'Bahçeyi suluyor', harvest: 'Hasat ediyor', search: 'Arıyor', relax: 'Dinleniyor', nap: 'Uyuyor', pet: 'Seviyor', eat: 'Yemek yiyor', meds: 'İlaç içiyor', warm: 'Isınıyor', walk: 'Yürüyor', wander: 'Geziniyor' };

function standFor(ch, task) {
  const s = G.home;
  if (task.type === 'clear') { const room = s.rooms[task.r][task.c]; return rubbleStand(s, room, charPos(ch)); }
  if (task.type === 'eat' || task.type === 'meds') return { row: ch.row, x: ch.x };
  if (task.type === 'walk' || task.type === 'wander') return { row: task.row, x: task.x };
  if (task.type === 'pet') { const p = G.pets[task.pet]; return p ? { row: p.row, x: p.x + (ch.x < p.x ? -22 : 22) } : null; }
  const o = objById(s, task.obj); if (!o) return null;
  if (task.type === 'nap') return { row: o.row, x: o.x };
  const idx = G.chars.indexOf(ch);
  return { row: o.row, x: o.x + ((idx % 3) - 1) * 9, face: ch.x < o.x ? 1 : -1 };
}
function taskDur(ch, t) {
  switch (t.type) {
    case 'clear': return 4.5;
    case 'craft': return RECIPES.find(r => r.id === t.recipe).time;
    case 'cook': return 4; case 'cocoa': return 3; case 'melt': return 3; case 'collect': return 1.5;
    case 'plant': return 2; case 'water_garden': return 1.5; case 'harvest': return 2;
    case 'search': { const o = objById(G.home, t.obj); return o && o.locked ? 3 : 2; }
    case 'relax': return 5; case 'pet': return 2; case 'eat': return 1.6; case 'meds': return 1.5; case 'warm': return 2;
    case 'nap': return 999; default: return 0;
  }
}
function workMult(ch, t) {
  let m = 1;
  if ((t.type === 'clear' || t.type === 'craft') && ch.trait === 'handy') m *= 1.5;
  if (t.type === 'clear' && G.tools.shovel) m *= 2;
  if ((t.type === 'cook' || t.type === 'cocoa' || t.type === 'melt') && ch.trait === 'cook') m *= 2;
  if (ch.st.energy < 12) m *= .6;
  if (ch.st.mood < 15) m *= .75;
  if (ch.sick) m *= .8;
  return m;
}

/** Give `ch` a task now (if idle) or queue it. Costs are paid immediately and refunded on cancel. */
function assign(ch, task) {
  if (!ch || ch.away) return false;
  if (task.cost) { if (!canPay(task.cost)) { toast('Malzeme yetmiyor: ' + costText(task.cost), 'icon.cross'); sfx('deny'); return false; } pay(task.cost); }
  if (ch.task && (ch.task.type === 'wander' || ch.task.type === 'walk')) { ch.task = null; ch.path = null; }
  if (!ch.task) { if (!startTask(ch, task)) { refund(task.cost); return false; } }
  else if (ch.queue.length < 3) { ch.queue.push(task); toast(`${ch.name}: sıraya eklendi`, 'icon.clock'); }
  else { refund(task.cost); toast(`${ch.name} çok meşgul (3 iş sırada)`, 'icon.clock'); return false; }
  sfx('tap'); return true;
}
function startTask(ch, task) {
  const stand = standFor(ch, task);
  const path = stand ? planPath(G.home, charPos(ch), stand) : null;
  if (!path) { toast(`${ch.name} oraya ulaşamıyor`, 'icon.cross'); return false; }
  task.prog = 0; task.dur = taskDur(ch, task); task.stand = stand;
  ch.task = task; ch.path = path; ch.climbP = 0;
  return true;
}
function nextTask(ch) {
  ch.task = null; ch.path = null;
  while (ch.queue.length) { const t = ch.queue.shift(); if (startTask(ch, t)) return; refund(t.cost); }
  ch.pose = 'idle'; ch.idleT = 3 + rand() * 5;
}
function cancelTasks(ch) {
  if (ch.task) refund(ch.task.cost);
  for (const t of ch.queue) refund(t.cost);
  if (ch.task && (ch.task.type === 'cook' || ch.task.type === 'cocoa' || ch.task.type === 'melt')) { const o = objById(G.home, ch.task.obj); if (o) o.lit = false; }
  ch.task = null; ch.queue = []; ch.path = null; ch.pose = 'idle'; ch.climbP = 0;
}

function stepPath(ent, dt, speed) {
  const st = ent.path[0]; if (!st) return true;
  if (st.t === 'walk') {
    if (ent.row !== st.row) ent.row = st.row;
    const dx = st.x - ent.x, step = speed * dt;
    if (Math.abs(dx) <= step) { ent.x = st.x; ent.path.shift(); }
    else { ent.x += Math.sign(dx) * step; ent.face = Math.sign(dx); }
    ent.pose = 'walk';
  } else {
    ent.x = st.x; ent.pose = 'climb';
    ent.climbP += dt * speed * .8 / (ROOM_H + SLAB);
    if (ent.climbP >= 1) { ent.row = st.to; ent.climbP = 0; ent.path.shift(); }
  }
  return ent.path.length === 0;
}

function updateChar(ch, dt) {
  ch.anim += dt;
  if (ch.away) return;
  const t = ch.task;
  if (ch.path && ch.path.length) { stepPath(ch, dt, ch.trait === 'runner' ? 82 : 72); return; }
  ch.path = null;
  if (!t) {
    ch.pose = ch.st.mood < 20 ? 'sad' : 'idle';
    if (OPTS.autoEat && ch.st.hunger < 28 && (G.inv.meal > 0 || G.inv.food > 0)) { assign(ch, { type: 'eat', auto: true }); return; }
    ch.idleT -= dt;
    if (ch.idleT <= 0) {
      ch.idleT = 4 + rand() * 6;
      const g = graph(G.home), i = segIndex(g, ch.row, ch.x);
      if (i >= 0) { const sg = g.rows[ch.row][i]; const x = clamp(ch.x + (rand() - .5) * 140, sg[0] + 14, sg[1] - 14); startTask(ch, { type: 'wander', row: ch.row, x }); }
    }
    return;
  }
  if (t.type === 'walk' || t.type === 'wander') { nextTask(ch); return; }
  if (t.stand && t.stand.face) ch.face = t.stand.face;
  // validate target still exists / still makes sense
  if (t.obj != null && !objById(G.home, t.obj)) { nextTask(ch); return; }
  if (t.type === 'clear' && G.home.rooms[t.r][t.c].rubble <= 0) { nextTask(ch); return; }
  ch.pose = TASK_POSE[t.type] || 'idle';
  if (t.type === 'cook' || t.type === 'cocoa' || t.type === 'melt') { const o = objById(G.home, t.obj); if (o) o.lit = true; }
  if (t.type === 'nap') {
    const o = objById(G.home, t.obj);
    ch.st.energy = Math.min(100, ch.st.energy + dt / HOUR_SEC * (o && o.kind === 'bed' ? 13 : 10));
    if (ch.st.energy >= 98) { floatFx('fx.sparkle', ch.x, floorY(ch.row) - 40); nextTask(ch); }
    return;
  }
  t.prog += dt * workMult(ch, t);
  if (t.prog >= t.dur) {
    const again = finishTask(ch, t);
    if (again) t.prog = 0; else nextTask(ch);
  }
}

function finishTask(ch, t) {
  const s = G.home, y0 = floorY(ch.row) - 70;
  switch (t.type) {
    case 'clear': {
      const room = s.rooms[t.r][t.c];
      room.rubble = Math.max(0, room.rubble - 1);
      const r = rand();
      gain(r < .5 ? 'wood' : r < .84 ? 'parts' : r < .94 ? 'cloth' : 'food', 1, ch.x + ch.face * 30, y0);
      sfx('dig'); dust(ch.x + ch.face * 40, floorY(ch.row) - 20);
      if (room.rubble <= 0) {
        bumpSite(s); updateReveal(s); G.stats.cleared++;
        toast('Yeni bir oda açıldı!', 'icon.star'); sfx('fanfare'); invalidateRooms();
        return false;
      }
      if (ch.st.energy < 6) { toast(`${ch.name} çok yorgun, dinlenmeli`, 'icon.energy'); return false; }
      return true;
    }
    case 'craft': completeRecipe(ch, RECIPES.find(r => r.id === t.recipe)); return false;
    case 'cook': {
      const o = objById(s, t.obj); if (o) o.lit = false;
      let n = 1; if (ch.trait === 'cook' && rand() < .35) n = 2;
      gain('meal', n, ch.x, y0); if (n === 2) toast('Ece bir porsiyon fazla çıkardı!', 'icon.meal');
      sfx('cook'); return false;
    }
    case 'melt': { const o = objById(s, t.obj); if (o) o.lit = false; gain('water', 2, ch.x, y0); sfx('water'); return false; }
    case 'cocoa': {
      const o = objById(s, t.obj); if (o) o.lit = false;
      for (const c of homeChars()) { c.st.mood = Math.min(100, c.st.mood + 18); floatFx('fx.heart', c.x, floorY(c.row) - 72); }
      toast('Sıcak kakao! Herkesin morali yükseldi', 'icon.cocoa'); sfx('happy'); return false;
    }
    case 'collect': { const o = objById(s, t.obj); const n = Math.floor(o.fill); o.fill -= n; gain('water', n, o.x, floorY(o.row) - 90); sfx('water'); return false; }
    case 'plant': { const o = objById(s, t.obj); o.planted = true; o.growth = 0; sfx('pick'); toast('Tohumlar ekildi. Sulamak hızlandırır.', 'icon.seeds'); return false; }
    case 'water_garden': { const o = objById(s, t.obj); o.growth = Math.min(1, o.growth + .25); sfx('water'); return false; }
    case 'harvest': { const o = objById(s, t.obj); o.planted = false; o.growth = 0; gain('food', 4, o.x, floorY(o.row) - 50); sfx('fanfare'); return false; }
    case 'search': {
      const o = objById(s, t.obj); o.searched = true; o.open = true;
      let i = 0; for (const k in o.loot) { gain(k, o.loot[k], o.x + (i - 1) * 18, floorY(o.row) - 60 - i * 6); i++; }
      if (!i) toast('Boş çıktı', 'icon.search');
      o.loot = {}; sfx('loot'); return false;
    }
    case 'relax': {
      const o = objById(s, t.obj);
      if (o.kind === 'guitar') { for (const c of homeChars()) { c.st.mood = Math.min(100, c.st.mood + 8); floatFx('fx.note', c.x, floorY(c.row) - 72); } ch.st.mood = Math.min(100, ch.st.mood + 6); sfx('music'); }
      else {
        const v = o.kind === 'armchair' ? 15 : o.kind === 'bookshelf' ? 12 : 10;
        ch.st.mood = Math.min(100, ch.st.mood + v); ch.st.energy = Math.min(100, ch.st.energy + 4); floatFx('fx.heart', ch.x, y0);
        if (o.kind === 'radio') { sfx('music'); radioTip(); } else sfx('happy');
      }
      return false;
    }
    case 'pet': ch.st.mood = Math.min(100, ch.st.mood + 9); floatFx('fx.heart', ch.x + 16, y0); sfx('purr'); return false;
    case 'warm': ch.st.mood = Math.min(100, ch.st.mood + 5); floatFx('fx.heart', ch.x, y0); return false;
    case 'eat': {
      if (G.inv.meal > 0) { G.inv.meal--; ch.st.hunger = Math.min(100, ch.st.hunger + 50); ch.st.mood = Math.min(100, ch.st.mood + 3); floatIcon('icon.meal', '-1', ch.x, y0); }
      else if (G.inv.food > 0) { G.inv.food--; ch.st.hunger = Math.min(100, ch.st.hunger + 26); ch.st.mood = Math.max(0, ch.st.mood - 2); floatIcon('icon.food', '-1', ch.x, y0); }
      else { toast('Yiyecek kalmadı!', 'icon.hunger'); return false; }
      hudDirty(); sfx('eat'); return false;
    }
    case 'meds': {
      if (G.inv.meds <= 0) return false;
      G.inv.meds--; ch.sick = false; ch.st.health = Math.min(100, ch.st.health + 30); floatFx('fx.sparkle', ch.x, y0); toast(`${ch.name} iyileşti`, 'icon.meds'); hudDirty(); sfx('happy'); return false;
    }
  }
  return false;
}

function completeRecipe(ch, r) {
  G.stats.crafted++;
  if (r.station) {
    const wb = G.home.objs.find(o => o.kind === 'workbench');
    const spot = findSlot(G.home, r.w, wb ? { row: wb.row, x: wb.x } : charPos(ch));
    if (!spot) { refund(r.cost); toast('Yer kalmadı! Bir odayı temizle, malzeme iade edildi.', 'icon.cross'); return; }
    const o = addStation(G.home, r.id, spot.row, spot.x);
    o.isNew = 3; dust(spot.x, floorY(spot.row) - 20); floatFx('fx.sparkle', spot.x, floorY(spot.row) - 60);
    toast(`${r.name} kuruldu!`, r.icon);
  } else if (r.tool) { G.tools[r.tool] = true; toast(`${r.name} hazır!`, r.icon); }
  else if (r.door) { G.door = r.door; toast(r.door === 2 ? 'Kapı artık çelik!' : 'Kapı güçlendirildi', 'icon.door'); }
  else if (r.upgrade) { G.wb = 2; const wb = G.home.objs.find(o => o.kind === 'workbench'); if (wb) wb.level = 2; toast('Atölye 2 hazır: yeni tarifler!', 'icon.workbench'); }
  sfx('build'); vibrate(25); save();
}

function recipeState(r) {
  if (r.lv > G.wb) return { ok: false, why: 'Atölye 2 gerekli', lock: true };
  if (r.tool && G.tools[r.tool]) return { ok: false, why: 'Zaten var', own: true };
  if (r.upgrade && G.wb >= 2) return { ok: false, why: 'Yapıldı', own: true };
  if (r.door && G.door >= r.door) return { ok: false, why: 'Yapıldı', own: true };
  if (r.door === 2 && G.door < 1) return { ok: false, why: 'Önce güçlendir', lock: true };
  if (r.max && stations(r.id).length >= r.max) return { ok: false, why: r.max === 1 ? 'Zaten var' : 'Yeterli', own: true };
  if (r.station && !findSlot(G.home, r.w, { row: 2, x: ROOM_W * 1.5 })) return { ok: false, why: 'Yer yok: oda temizle' };
  if (inQueue(r.id)) return { ok: false, why: 'Yapılıyor' };
  if (!canPay(r.cost)) return { ok: false, why: 'Malzeme eksik' };
  return { ok: true };
}
function inQueue(rid) {
  const r = RECIPES.find(x => x.id === rid);
  if (r.station) return r.max ? stations(r.id).length + G.chars.reduce((n, c) => n + (c.task && c.task.recipe === rid ? 1 : 0) + c.queue.filter(t => t.recipe === rid).length, 0) >= r.max : false;
  return G.chars.some(c => (c.task && c.task.recipe === rid) || c.queue.some(t => t.recipe === rid));
}
function craftRecipe(rid) {
  const r = RECIPES.find(x => x.id === rid), st = recipeState(r);
  if (!st.ok) { toast(st.why, 'icon.cross'); sfx('deny'); return false; }
  const wb = G.home.objs.find(o => o.kind === 'workbench');
  const ch = pickWorker({ row: wb.row, x: wb.x });
  if (!ch) { toast('Evde kimse yok', 'icon.cross'); return false; }
  return assign(ch, { type: 'craft', recipe: rid, obj: wb.id, cost: Object.assign({}, r.cost) });
}

/** Selected survivor, else the nearest idle one, else the least busy. */
function pickWorker(near) {
  const sel = G.chars.find(c => c.id === G.sel && !c.away);
  if (sel) return sel;
  const avail = homeChars(); if (!avail.length) return null;
  const score = c => (c.task && c.task.type !== 'wander' ? 1000 + c.queue.length * 1000 : 0) + (c.row !== near.row ? 300 : 0) + Math.abs(c.x - near.x);
  return avail.slice().sort((a, b) => score(a) - score(b))[0];
}

// ----- stats & time -----
function applyStats(dh) {
  const cheer = homeChars().some(c => c.trait === 'cheer');
  for (const ch of homeChars()) {
    const s = ch.st, t = ch.task;
    const napping = t && t.type === 'nap' && !ch.path;
    const working = t && !ch.path && ['clear', 'craft', 'cook', 'cocoa', 'melt', 'search', 'harvest', 'plant', 'collect'].includes(t.type);
    s.hunger -= 2.2 * dh;
    if (!napping) s.energy -= (working ? 3.2 : ch.path ? 2 : 1) * dh;
    let md = cheer ? -.6 : -1.1;
    if (s.hunger < 20) md -= 1.2; if (s.energy < 15) md -= 1; if (ch.sick) md -= .8;
    s.mood += md * dh;
    if (s.hunger <= 0) s.health -= 3 * dh; else if (ch.sick) s.health -= 1.5 * dh; else if (s.hunger > 40) s.health += .8 * dh;
    for (const k in s) s[k] = clamp(s[k], 0, 100);
    if (s.health <= 0) G.pendingLoss = true;
  }
}
function updateStations(dh) {
  for (const o of G.home.objs) {
    if (o.t !== 'station') continue;
    if (o.kind === 'water') o.fill = Math.min(4, o.fill + dh * .16);
    if (o.kind === 'garden' && o.planted) o.growth = Math.min(1, o.growth + dh / 30);
    if (o.kind === 'heater') o.lit = G.clock >= 17 && G.inv.wood > 0;
    if (o.isNew) o.isNew = Math.max(0, o.isNew - dh * 4);
  }
}
function simDay(dt) {
  const dh = dt / HOUR_SEC;
  G.clock += dh;
  applyStats(dh); updateStations(dh);
  for (const ch of G.chars) updateChar(ch, dt);
  for (const p of G.pets) updatePet(p, dt);
  if (G.pendingLoss) { G.pendingLoss = false; checkLosses(true); }
  if (G.clock >= NIGHT_AT) { G.clock = NIGHT_AT; startNight(); }
}
function updatePet(p, dt) {
  p.t -= dt;
  if (p.goal != null) {
    const dx = p.goal - p.x, sp = (p.kind === 'dog' ? 55 : 38) * dt;
    if (Math.abs(dx) <= sp) { p.x = p.goal; p.goal = null; p.pose = 'sit'; p.t = 3 + rand() * 4; }
    else { p.x += Math.sign(dx) * sp; p.face = Math.sign(dx); p.pose = 'walk'; }
    return;
  }
  if (p.t > 0) return;
  if (p.pose === 'sleep' || p.pose === 'sit' && rand() < .5) {
    const g = graph(G.home), i = segIndex(g, p.row, p.x);
    if (i >= 0) { const sg = g.rows[p.row][i]; p.goal = clamp(p.x + (rand() - .5) * 220, sg[0] + 16, sg[1] - 16); }
    p.t = 1;
  } else { p.pose = 'sleep'; p.t = 8 + rand() * 10; }
}

function checkLosses(daytime) {
  const lines = [];
  for (const ch of G.chars.slice()) {
    if (ch.st.health > 0) continue;
    cancelTasks(ch);
    G.chars.splice(G.chars.indexOf(ch), 1); G.lost.push(ch.name);
    if (G.sel === ch.id) G.sel = null;
    lines.push({ ic: 'icon.health', bad: true, txt: `${ch.name} çok hastalandı. Kurtarma kızağı onu hastaneye götürdü. Geçmiş olsun!` });
  }
  if (daytime && lines.length) { for (const l of lines) toast(l.txt, l.ic); rebuildCards(); }
  if (daytime && !G.chars.length) setTimeout(() => endGame(false), 400);
  return lines;
}

// ----- night -----
function startNight() {
  G.phase = 'plan';
  for (const ch of G.chars) { cancelTasks(ch); if (ch.away) ch.away = false; }
  G.plan = { roles: Object.fromEntries(G.chars.map(c => [c.id, 'sleep'])), loc: null, mode: 'play' };
  closeBubble(); closeCraft();
  sfx('night'); save();
  openNightPlan();
}

function beginNight() {
  const p = G.plan;
  const scavId = Object.keys(p.roles).find(id => p.roles[id] === 'scav');
  if (scavId && p.loc) {
    const ch = G.chars.find(c => c.id === scavId);
    if (p.mode === 'play') { startScav(p.loc, ch); return; }
    resolveNight(quickScav(p.loc, ch));
  } else resolveNight(null);
}

function resolveNight(scav) {
  const lines = [], inv = G.inv, plan = G.plan || { roles: {} };
  closeModal();
  if (scav) {
    const loc = LOCS.find(l => l.id === scav.loc);
    const got = Object.entries(scav.got).filter(([, v]) => v > 0);
    for (const [k, v] of got) inv[k] += v;
    lines.push({ ic: 'icon.backpack', good: got.length > 0, txt: got.length ? `${scav.name} ${loc.name} keşfinden döndü: ${got.map(([k, v]) => `+${v} ${ITEMS[k].name}`).join(', ')}` : `${scav.name} ${loc.name}'dan eli boş döndü.` });
    if (scav.stolen && scav.stolen.length) lines.push({ ic: 'icon.raccoon', bad: true, txt: `Bir rakun ${scav.name}'in çantasından ${scav.stolen.map(k => ITEMS[k].name.toLowerCase()).join(', ')} kaptı!` });
    G.stats.scavs++;
  }
  // heating
  const heater = hasStation('heater'), need = G.flags.storm ? 2 : 1;
  let warm = false;
  if (heater) {
    if (inv.wood >= need) { inv.wood -= need; warm = true; lines.push({ ic: 'icon.heater', good: true, txt: `Soba gece boyunca yandı (−${need} odun).` }); }
    else lines.push({ ic: 'icon.cold', bad: true, txt: 'Sobaya atacak odun kalmadı, gece soğuktu.' });
  }
  const coldK = warm ? 0 : (G.day >= 3 ? 1 : .45) * (G.flags.storm ? 1.6 : 1);
  if (!heater && G.day >= 3) lines.push({ ic: 'icon.cold', bad: true, txt: 'Ev çok soğuk. Bir Soba herkesi korur.' });
  // water
  let thirsty = 0;
  for (const ch of G.chars) { if (inv.water > 0) inv.water--; else { thirsty++; ch.st.mood -= 6; ch.st.health -= 4; } }
  if (thirsty) lines.push({ ic: 'icon.water', bad: true, txt: `${thirsty} kişi susuz kaldı. Su Toplayıcı kur ve suyu biriktir.` });
  else lines.push({ ic: 'icon.water', txt: `Herkes su içti (−${G.chars.length} su).` });
  // sleep
  const beds = [...stations('bed').map(() => 'bed'), ...stations('floorbed').map(() => 'floorbed')];
  const sleepers = G.chars.filter(c => plan.roles[c.id] !== 'scav' && plan.roles[c.id] !== 'guard').sort((a, b) => a.st.energy - b.st.energy);
  let noBed = 0;
  for (const ch of G.chars) {
    const role = plan.roles[ch.id] || 'sleep', s = ch.st;
    s.hunger -= role === 'scav' ? 18 : 12;
    if (role === 'sleep') {
      const b = beds[sleepers.indexOf(ch)];
      s.energy += b === 'bed' ? 75 : b === 'floorbed' ? 58 : 40; s.mood += b === 'bed' ? 3 : b ? 0 : -6; if (!b) noBed++;
    } else if (role === 'guard') { s.energy -= 10; s.mood -= 2; }
    else s.energy -= 25;
    s.mood -= 10 * coldK; s.health -= 6 * coldK;
    const pSick = .16 * coldK + (s.hunger < 20 ? .15 : 0) + (s.energy < 10 ? .1 : 0);
    if (!ch.sick && rand() < pSick) { ch.sick = true; lines.push({ ic: 'icon.sick', bad: true, txt: `${ch.name} üşüttü. İlaç onu iyileştirir.` }); }
    if (ch.sick) s.health -= 6;
  }
  if (noBed) lines.push({ ic: 'icon.bed', bad: true, txt: `${noBed} kişi yerde uyudu. Yatak yapmak uykuyu iyileştirir.` });
  // raccoon raid
  const truce = G.flags.truceUntil && G.day < G.flags.truceUntil;
  const pRaid = truce ? 0 : (G.day < 2 ? 0 : Math.min(.6, .2 + .05 * G.day)) * [1, .55, .22][G.door];
  if (rand() < pRaid) {
    const guard = G.chars.find(c => plan.roles[c.id] === 'guard');
    if (guard && rand() < .85) { guard.st.mood += 6; lines.push({ ic: 'icon.guard', good: true, txt: `Nöbetçi ${guard.name} kapıyı zorlayan rakunları kovaladı!` }); }
    else {
      const stolen = {}, keys = ['food', 'meal', 'wood', 'parts', 'cloth', 'water'];
      let n = 2 + Math.floor(rand() * 3);
      for (let i = 0; i < 20 && n > 0; i++) { const k = pick(keys); if (inv[k] > 0) { inv[k]--; stolen[k] = (stolen[k] || 0) + 1; n--; } }
      const list = Object.entries(stolen);
      if (list.length) { G.flags.raided = true; G.stats.raids++; lines.push({ ic: 'icon.raccoon', bad: true, txt: `Gece rakunlar girdi: ${list.map(([k, v]) => `−${v} ${ITEMS[k].name}`).join(', ')}. Nöbetçi koy ya da kapıyı güçlendir.` }); }
    }
  } else if (truce) lines.push({ ic: 'icon.raccoon', good: true, txt: 'Rakunlar sözlerini tuttu, gece sessizdi.' });
  // pets, stations
  if (G.flags.dog) { for (const ch of G.chars) ch.st.mood += 3; if (G.day % 2 === 0 && inv.food > 0) { inv.food--; lines.push({ ic: 'icon.paw', txt: 'Fındık bir erzak yedi ve herkese sokuldu.' }); } }
  for (const o of G.home.objs) {
    if (o.kind === 'garden' && o.planted) o.growth = Math.min(1, o.growth + .3);
    if (o.kind === 'water') o.fill = Math.min(4, o.fill + 2);
    if (o.kind === 'heater') o.lit = false;
  }
  for (const ch of G.chars) for (const k in ch.st) ch.st[k] = clamp(ch.st[k], 0, 100);
  lines.push(...checkLosses(false));
  G.flags.storm = false;
  G.day++; G.clock = DAY_START; G.phase = 'day'; G.plan = null;
  refillPools();
  for (const ch of G.chars) { ch.away = false; ch.pose = 'idle'; ch.path = null; ch.task = null; ch.queue = []; }
  placeAtHome();
  rebuildCards(); hudDirty();
  if (!G.chars.length) { endGame(false); return; }
  if (G.day >= WIN_DAY) { save(); showMorning(lines, null, true); return; }
  const ev = pickEvent();
  save();
  showMorning(lines, ev, false);
}
function placeAtHome() {
  // after a night everyone wakes up somewhere reachable on the ground/first floor
  const spots = [];
  const beds = G.home.objs.filter(o => o.kind === 'bed' || o.kind === 'floorbed');
  for (const b of beds) spots.push({ row: b.row, x: b.x + 30 });
  const g = graph(G.home);
  for (const ch of G.chars) {
    const sp = spots.shift();
    if (sp && segIndex(g, sp.row, sp.x) >= 0) { ch.row = sp.row; ch.x = sp.x; }
    else if (segIndex(g, ch.row, ch.x) < 0) { ch.row = 2; ch.x = 60 + rand() * 300; }
    ch.x += (rand() - .5) * 30;
    const i = segIndex(g, ch.row, ch.x); if (i < 0) { ch.row = 2; ch.x = 150; }
  }
}

// ----- events -----
function eventEligible(e) {
  const key = e.days ? e.id + G.day : e.id;
  if (G.done[key]) return false;
  if (e.day && e.day !== G.day) return false;
  if (e.days && !e.days.includes(G.day)) return false;
  if (e.minDay && G.day < e.minDay) return false;
  if (e.maxDay && G.day > e.maxDay) return false;
  if (e.after && !(G.flags[e.after] && G.day >= (G.flags[e.after + 'Day'] || 0) + (e.delay || 0))) return false;

// ===== 40-scav: night scavenging (playable or quick) =====
function bagCap(ch) { return 8 + (G.tools.backpack ? 4 : 0) + (ch.trait === 'runner' ? 3 : 0); }
function poolTotal(id) { const p = G.locPools[id]; let n = 0; for (const k in p) n += p[k]; return n; }
function refillPools() {
  for (const l of LOCS) { const p = G.locPools[l.id]; for (const k in l.pool) p[k] = Math.min(l.pool[k], (p[k] || 0) + Math.ceil(l.pool[k] * .3)); }
}
function raccoonCount(loc) {
  let n = loc.danger;

  if (loc.danger === 0 && G.day < 8) n = 0;
  return Math.min(3, n);
}

function startScav(locId, ch) {
  const loc = LOCS.find(l => l.id === locId);
  const visits = G.locVisits[locId] || 0;
  const aid = locId === 'park' && !!G.flags.aidPark;
  const site = buildPlace(loc, G.locPools[locId], G.seed + G.day * 131 + visits * 17, aid);
  if (aid) G.flags.aidPark = false;
  const rnd = K.rng(G.seed + G.day * 7 + visits);
  const coons = [];
  const n = raccoonCount(loc);
  const g = graph(site);
  for (let i = 0, tries = 0; coons.length < n && tries < 40; tries++) {
    const r = rnd() < .5 ? 0 : 1, c = Math.floor(rnd() * 3);
    if (r === 1 && c === 0) continue;
    const x = c * ROOM_W + 30 + rnd() * (ROOM_W - 60);
    if (segIndex(g, r, x) < 0) continue;
    coons.push({ id: i++, row: r, x, face: rnd() < .5 ? -1 : 1, state: 'wander', goal: x, t: rnd() * 3, sack: false, dir: 0 });
  }
  ch.away = true;
  G.scav = { loc: locId, site, ch: ch.id, name: ch.name, art: ch.art, trait: ch.trait, row: site.door.row, x: site.door.x + 10, face: 1, pose: 'idle', path: null, task: null, climbP: 0, anim: 0,
    bag: [], cap: bagCap(ch), t: 0, limit: SCAV_SECONDS, coons, stolen: [], taken: {}, shooT: 0 };
  G.phase = 'scav'; G.sel = null;
  closeModal(); showScavHud(true); fitCamera(true);
  toast(`${ch.name} ${loc.name}'a vardı. Eşyalara dokun, rakunlara dikkat!`, loc.danger ? 'icon.raccoon' : 'icon.search');
  sfx('door'); save();
}

function scavAct(target) {
  const S = G.scav; if (!S) return;
  const site = S.site;
  if (target.k === 'coon') {
    const c = target.c;
    if (c.row === S.row && Math.abs(c.x - S.x) < 150) { shoo(c); return; }
    scavGo({ row: c.row, x: c.x - Math.sign(c.x - S.x) * 60 }, null); return;
  }
  if (target.k === 'obj') {
    const o = target.o;
    if (o.searched) { toast('Burası boş', 'icon.search'); return; }
    if (o.locked && !G.tools.crowbar) { toast('Kilitli. Atölyede Levye yap.', 'icon.lock'); sfx('deny'); return; }
    scavGo({ row: o.row, x: o.x - 14 }, { type: 'search', obj: o.id, prog: 0, dur: (o.locked ? 2.6 : 1.8) * (S.trait === 'runner' ? .8 : 1) });
    return;
  }
  if (target.k === 'room') {
    const st = rubbleStand(site, target.room, { row: S.row, x: S.x });
    if (!st) { toast('Oraya ulaşılamıyor', 'icon.cross'); return; }
    scavGo(st, { type: 'clear', r: target.room.r, c: target.room.c, prog: 0, dur: 2, face: st.face }); return;
  }
  if (target.k === 'floor') { scavGo({ row: target.row, x: target.x }, null); return; }
  if (target.k === 'exit') { endScav(false); }
}
function scavGo(to, task) {
  const S = G.scav;
  const path = planPath(S.site, { row: S.row, x: S.x }, to);
  if (!path) { toast('Oraya ulaşılamıyor', 'icon.cross'); return; }
  S.path = path; S.task = task; S.climbP = 0; sfx('tap');
}
function shoo(c) {
  const S = G.scav;
  c.state = 'flee'; c.dir = c.x < S.x ? -1 : 1; c.face = c.dir;
  S.pose = 'wave'; S.shooT = 1.2;
  floatText('Kışşt!', S.x, floorY(S.row) - 84);
  sfx('shoo'); vibrate(15);
}

function updateScav(dt) {
  const S = G.scav; if (!S) return;
  S.t += dt; S.anim += dt; S.shooT = Math.max(0, S.shooT - dt);
  if (S.t >= S.limit) { toast('Şafak söküyor! Eve dönüş vakti.', 'icon.sun'); endScav(true); return; }
  const site = S.site;
  if (S.path && S.path.length) stepPath(S, dt, S.trait === 'runner' ? 98 : 82);
  else {
    S.path = null;
    const t = S.task;
    if (t) {
      if (t.face) S.face = t.face;
      S.pose = t.type === 'clear' ? 'work' : 'search';
      t.prog += dt;
      if (t.prog >= t.dur) {
        if (t.type === 'search') { scavLoot(objById(site, t.obj)); S.task = null; }
        else {
          const room = site.rooms[t.r][t.c]; room.rubble--; dust(S.x + S.face * 40, floorY(S.row) - 20); sfx('dig');
          if (room.rubble <= 0) { bumpSite(site); invalidateRooms(); S.task = null; } else t.prog = 0;
        }
      }
    } else if (S.shooT <= 0) S.pose = 'idle';
  }
  // raccoons
  const g = graph(site);
  for (const c of S.coons) {
    if (c.state === 'gone') continue;
    c.t -= dt;
    if (c.state === 'flee') {
      c.x += c.dir * 135 * dt;
      if (c.x < -40 || c.x > siteW(site) + 40) c.state = 'gone';
      continue;
    }
    const i = segIndex(g, c.row, c.x), sg = i >= 0 ? g.rows[c.row][i] : [0, siteW(site)];
    const same = c.row === S.row && !(S.path && S.path[0] && S.path[0].t === 'climb');
    const dx = S.x - c.x;
    if (same && S.t > 5 && Math.abs(dx) < 190 && segIndex(g, S.row, S.x) === i) {
      c.state = 'chase'; c.face = Math.sign(dx) || 1;
      c.x += c.face * 46 * dt;
      if (Math.abs(dx) < 20 && S.shooT <= 0) steal(c);
    } else {
      c.state = 'wander';
      if (c.t <= 0) { c.t = 2 + rand() * 3; c.goal = sg[0] + 20 + rand() * Math.max(10, sg[1] - sg[0] - 40); }
      const gx = c.goal - c.x;
      if (Math.abs(gx) > 3) { c.face = Math.sign(gx); c.x += c.face * 24 * dt; }
    }
    c.x = clamp(c.x, sg[0] + 10, sg[1] - 10);
  }
}
function steal(c) {
  const S = G.scav;
  if (S.bag.length) {
    const i = Math.floor(rand() * S.bag.length), k = S.bag.splice(i, 1)[0];
    S.stolen.push(k); c.sack = true;
    toast(`Rakun bir ${ITEMS[k].name.toLowerCase()} kaptı! Yaklaşınca üstüne dokun: Kışşt!`, 'icon.raccoon');
    floatIcon(ITEMS[k].icon, '-1', S.x, floorY(S.row) - 80);
  } else toast('Rakun çantanı boş bulunca kıkırdayıp kaçtı', 'icon.raccoon');
  c.state = 'flee'; c.dir = c.x < S.x ? -1 : 1; c.face = c.dir;
  S.pose = 'sad'; S.shooT = .8;
  sfx('steal'); vibrate(40); updateBag();
}
function scavLoot(o) {
  const S = G.scav; if (!o) return;
  let added = 0, left = 0, i = 0;
  for (const k of Object.keys(o.loot)) {
    while (o.loot[k] > 0) {
      if (S.bag.length >= S.cap) { left += o.loot[k]; break; }
      o.loot[k]--; S.bag.push(k); S.taken[k] = (S.taken[k] || 0) + 1; added++;
    }
    if (o.loot[k] <= 0) delete o.loot[k];
    if (added) floatIcon(ITEMS[k].icon, '+', o.x + (i++ - 1) * 18, floorY(o.row) - 64);
  }
  o.locked = false;
  if (!Object.keys(o.loot).length) { o.searched = true; o.open = true; }
  if (!added && !left) toast('Boş çıktı', 'icon.search');
  if (left) toast('Çanta doldu! Eve dönebilirsin.', 'icon.backpack');
  sfx(added ? 'loot' : 'deny'); updateBag();
}
function endScav(timeUp) {
  const S = G.scav; if (!S) return;
  const pool = G.locPools[S.loc];
  for (const k in S.taken) pool[k] = Math.max(0, (pool[k] || 0) - S.taken[k]);
  G.locVisits[S.loc] = (G.locVisits[S.loc] || 0) + 1;
  const got = {}; for (const k of S.bag) got[k] = (got[k] || 0) + 1;
  const res = { loc: S.loc, name: S.name, got, stolen: S.stolen.slice() };
  G.scav = null;
  showScavHud(false); fitCamera(true);
  resolveNight(res);
}
function quickScav(locId, ch) {
  const loc = LOCS.find(l => l.id === locId), pool = G.locPools[locId];
  const bag = [];
  for (const k in pool) for (let i = 0; i < pool[k]; i++) bag.push(k);
  for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
  const n = Math.min(bag.length, Math.round(bagCap(ch) * (.6 + rand() * .25)));
  const taken = bag.slice(0, n);
  for (const k of taken) pool[k] = Math.max(0, pool[k] - 1);
  const stolen = [];
  if (rand() < loc.danger * .3 + (G.day >= 6 ? .1 : 0)) { for (let i = 0; i < 1 + (rand() < .4 ? 1 : 0) && taken.length; i++) stolen.push(taken.splice(Math.floor(rand() * taken.length), 1)[0]); }
  const got = {}; for (const k of taken) got[k] = (got[k] || 0) + 1;
  if (locId === 'park' && G.flags.aidPark) { G.flags.aidPark = false; got.food = (got.food || 0) + 3; got.meal = (got.meal || 0) + 2; got.meds = (got.meds || 0) + 1; }
  G.locVisits[locId] = (G.locVisits[locId] || 0) + 1;
  return { loc: locId, name: ch.name, got, stolen };
}

// ===== 50-render: camera, scene drawing, lighting, floating fx =====
const cvs = document.getElementById('stage');
const ctx = cvs.getContext('2d');
const lcvs = document.createElement('canvas'), lctx = lcvs.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
const cam = { x: 0, y: 0, z: 1, fitZ: 1, user: 1, minX: 0, maxX: 0, minY: 0, maxY: 0, offX: 0 };
let FX = [];
const roomCache = new Map();
let simT = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth; VH = window.innerHeight;
  cvs.width = Math.round(VW * DPR); cvs.height = Math.round(VH * DPR);
  cvs.style.width = VW + 'px'; cvs.style.height = VH + 'px';
  lcvs.width = Math.max(1, Math.ceil(VW / 2)); lcvs.height = Math.max(1, Math.ceil(VH / 2));
  fitCamera(false);
}
function curSite() { return G && G.phase === 'scav' && G.scav ? G.scav.site : G ? G.home : null; }
/** Fit the current building on screen. Title screen leaves room on the right for the menu card. */
function fitCamera(reset) {
  const s = curSite(); if (!s) return;
  const home = s.kind === 'home';
  const bx0 = home ? -250 : -70, bx1 = siteW(s) + (home ? 70 : 70);
  const by0 = -112, by1 = floorY(s.rows - 1) + 36;
  const titleShift = state === 'title' ? .44 : 0;
  const availW = VW * (1 - titleShift), availH = VH - 40;
  cam.fitZ = Math.min(availW / (bx1 - bx0), availH / (by1 - by0));
  if (reset) cam.user = 1;
  cam.z = cam.fitZ * cam.user;
  cam.minX = bx0; cam.maxX = bx1; cam.minY = by0; cam.maxY = by1;
  cam.offX = -VW * titleShift / 2;
  if (reset || !cam.x) { cam.x = (bx0 + bx1) / 2; cam.y = (by0 + by1) / 2 - 20 / cam.z; }
  clampCam();
}
function clampCam() {
  const hw = VW / 2 / cam.z, hh = VH / 2 / cam.z;
  const cx = (cam.minX + cam.maxX) / 2, cy = (cam.minY + cam.maxY) / 2;
  const spanX = Math.max(0, (cam.maxX - cam.minX) / 2 - hw), spanY = Math.max(0, (cam.maxY - cam.minY) / 2 - hh + 30);
  cam.x = clamp(cam.x, cx - spanX, cx + spanX);
  cam.y = clamp(cam.y, cy - spanY - 20, cy + spanY);
}
function w2s(x, y) { return [(x - cam.x) * cam.z + VW / 2 + cam.offX, (y - cam.y) * cam.z + VH / 2]; }
function s2w(x, y) { return [(x - VW / 2 - cam.offX) / cam.z + cam.x, (y - VH / 2) / cam.z + cam.y]; }
function setWorld() { const s = cam.z * DPR; ctx.setTransform(s, 0, 0, s, (VW / 2 + cam.offX - cam.x * cam.z) * DPR, (VH / 2 - cam.y * cam.z) * DPR); }
function invalidateRooms() { roomCache.clear(); }

function roomCanvas(s, room) {
  const zk = Math.round(cam.z * DPR * 20) / 20;
  const key = `${s.kind}:${s.locId || ''}:${room.r},${room.c}:${zk}:${room.style}:${room.hole}`;
  let c = roomCache.get(key);
  if (c) return c;
  c = document.createElement('canvas');
  c.width = Math.ceil(ROOM_W * zk) + 2; c.height = Math.ceil(ROOM_H * zk) + 2;
  c._zk = zk;
  const x = c.getContext('2d'); x.scale(zk, zk);
  K.draw(x, 'room.wall', 0, 0, { w: ROOM_W, h: ROOM_H, style: room.style, color: room.color, dirt: s.kind === 'home' ? .25 : .45, seed: room.seed });
  if (room.hole) K.draw(x, 'room.hole', 18, 16, { w: 70, h: 54, seed: room.seed });
  if (roomCache.size > 80) roomCache.clear();
  roomCache.set(key, c);

// ----- darkness model -----
function darkness() {
  if (!G) return 0;
  if (state === 'title') return .32;
  if (G.phase === 'scav') return .76;
  if (G.phase === 'plan' || G.phase === 'morning' && G.clock < 6.2) return .62;
  const h = G.clock;
  if (h < 6.6) return .5 * (6.6 - h);
  if (h < 17) return 0;
  return Math.min(.6, .6 * (h - 17) / 3);
}
function skyTime() {
  if (!G) return .5;
  if (state === 'title') return .52;
  if (G.phase === 'scav' || G.phase === 'plan') return .78;
  return clamp((G.clock - 6) / 24, 0, 1);
}

// ----- main render -----
function render(t) {
  simT = t;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#2a2257'; ctx.fillRect(0, 0, cvs.width, cvs.height);

  setWorld();
  drawSite(s, t);
  const d = darkness();
  if (d > .01) drawLighting(s, d, t);
  setWorld();
  drawAfterLight(s, t, d);
  drawFX(t);
}

// ----- lighting -----
function drawLighting(s, d, t) {
  const lw = lcvs.width, lh = lcvs.height, k = cam.z * .5;
  const ox = (VW / 2 + cam.offX) * .5 - cam.x * k, oy = VH / 4 - cam.y * k;
  lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.globalCompositeOperation = 'source-over'; lctx.clearRect(0, 0, lw, lh);
  lctx.fillStyle = `rgba(22,16,58,${d})`; lctx.fillRect(0, 0, lw, lh);
  lctx.globalCompositeOperation = 'destination-out';
  const hole = (x, y, r, a) => {
    const sx = ox + x * k, sy = oy + y * k, sr = r * k;
    if (sx < -sr || sy < -sr || sx > lw + sr || sy > lh + sr) return;
    const g = lctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
    g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(.6, `rgba(0,0,0,${a * .75})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    lctx.fillStyle = g; lctx.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
  };
  const warm = [];
  if (s.kind === 'home') {
    for (let r = 0; r < s.rows; r++) for (let c = 0; c < s.cols; c++) {
      const room = s.rooms[r][c];
      if (room.bulb && room.rubble <= 0 && room.revealed) { const x = c * ROOM_W + ROOM_W / 2, y = ceilY(r) + 40; hole(x, y, 150 + Math.sin(t * 3 + c) * 3, .95); warm.push([x, y, 130]); }
    }
    for (const o of s.objs) if ((o.kind === 'stove' || o.kind === 'heater') && o.lit) { hole(o.x, floorY(o.row) - 40, 110, .9); warm.push([o.x, floorY(o.row) - 40, 90]); }
    hole(ROOM_W * 1.5, ceilY(2) + 10, 120, .5);
    for (const ch of G.chars) if (!ch.away) hole(ch.x, charY(ch) - 34, 46, .45);
  } else if (G.scav) {
    const S = G.scav;
    let y = floorY(S.row); if (S.path && S.path[0] && S.path[0].t === 'climb') y += (floorY(S.path[0].to) - floorY(S.row)) * S.climbP;
    hole(S.x + S.face * 20, y - 36, 135 + Math.sin(t * 7) * 2, .97);
    warm.push([S.x + S.face * 20, y - 36, 100]);
    for (let r = 0; r < s.rows; r++) for (let c = 0; c < s.cols; c++) for (const dcr of s.rooms[r][c].decor) if (dcr.a === 'st.window') hole(c * ROOM_W + dcr.x, ceilY(r) + dcr.y - 28, 60, .32);
  }
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = true;
  ctx.drawImage(lcvs, 0, 0, cvs.width, cvs.height);
  ctx.globalCompositeOperation = 'lighter';
  for (const [x, y, r] of warm) {
    const [sx, sy] = w2s(x, y), sr = r * cam.z * DPR;
    const g = ctx.createRadialGradient(sx * DPR, sy * DPR, 0, sx * DPR, sy * DPR, sr);
    g.addColorStop(0, `rgba(255,170,80,${.16 * d})`); g.addColorStop(1, 'rgba(255,140,60,0)');
    ctx.fillStyle = g; ctx.fillRect(sx * DPR - sr, sy * DPR - sr, sr * 2, sr * 2);
  }
  ctx.restore();
}

function drawAfterLight(s, t, d) {

const ICON_URL = {};
function iconURL(name) {

    if (d.tags.includes('icon') || d.tags.includes('fx')) url = K.toCanvas(name, { t: .35 }, 2, 0).toDataURL();

    const c = $('evArt'), x = c.getContext('2d'); x.fillStyle = '#ffe8c7'; x.fillRect(0, 0, 300, 300);

  $('eNew').addEventListener('click', () => { closeModal(); startNew(); });
}
function setSpeedUI() { if (!G) return; $('speed').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.s === G.speed)); }
$('speed').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || !G) return; G.speed = +b.dataset.s; setSpeedUI(); sfx('tap'); });

// ===== 70-input: taps, drag-to-pan, pinch-zoom, keyboard =====
const ptrs = new Map();
let gest = null, lastTap = { t: 0, x: 0, y: 0 };

cvs.addEventListener('pointerdown', e => {
  initAudio();
  e.preventDefault();
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY });
  try { cvs.setPointerCapture(e.pointerId); } catch (_) {}
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    gest = { type: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, u0: cam.user, w: s2w(mx, my) };
  } else if (ptrs.size === 1) gest = { type: 'tap' };
}, { passive: false });

cvs.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  e.preventDefault();
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (!gest) return;
  if (gest.type === 'pinch' && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    setZoom(gest.u0 * d / gest.d0, gest.w, mx, my);
  } else if (gest.type === 'tap' && Math.hypot(e.clientX - p.sx, e.clientY - p.sy) > 10) gest.type = 'pan';
  if (gest.type === 'pan') { cam.x -= dx / cam.z; cam.y -= dy / cam.z; clampCam(); }
}, { passive: false });

function endPtr(e) {
  const p = ptrs.get(e.pointerId); if (!p) return;
  ptrs.delete(e.pointerId);
  if (gest && gest.type === 'tap' && ptrs.size === 0 && e.type === 'pointerup') handleTap(e.clientX, e.clientY);
  if (ptrs.size === 0) gest = null;
  else if (gest && gest.type === 'pinch') gest = { type: 'pan' };
}
cvs.addEventListener('pointerup', endPtr);
cvs.addEventListener('pointercancel', endPtr);
cvs.addEventListener('wheel', e => { e.preventDefault(); setZoom(cam.user * (e.deltaY < 0 ? 1.12 : 1 / 1.12), s2w(e.clientX, e.clientY), e.clientX, e.clientY); }, { passive: false });

function setZoom(u, worldPt, sx, sy) {
  cam.user = clamp(u, 1, 2.6); cam.z = cam.fitZ * cam.user;
  cam.x = worldPt[0] - (sx - VW / 2 - cam.offX) / cam.z;
  cam.y = worldPt[1] - (sy - VH / 2) / cam.z;
  clampCam();
}

function hitTest(s, wx, wy) {
  const home = s.kind === 'home';
  if (home) {
    let best = null, bd = 1e9;
    for (const ch of G.chars) {
      if (ch.away) continue;
      const p = charDrawPos(ch);
      const dx = Math.abs(wx - p.x);
      const inY = p.pose === 'sleep' ? wy > p.y - 30 && wy < p.y + 6 : wy > p.y - 74 && wy < p.y + 6;
      if (inY && dx < (p.pose === 'sleep' ? 36 : 20) && dx < bd) { bd = dx; best = { k: 'char', ch }; }
    }
    if (best) return best;
    for (let i = 0; i < G.pets.length; i++) { const p = G.pets[i], y = floorY(p.row); if (Math.abs(wx - p.x) < 22 && wy > y - 36 && wy < y + 6) return { k: 'pet', i }; }
  } else if (G.scav) {
    for (const c of G.scav.coons) { if (c.state === 'gone' || c.state === 'flee') continue; const y = floorY(c.row); if (Math.abs(wx - c.x) < 28 && wy > y - 46 && wy < y + 8) return { k: 'coon', c }; }
  }
  // objects (smallest first so a crate in front of a shelf wins)
  const objs = s.objs.slice().sort((a, b) => a.w - b.w);
  for (const o of objs) {
    const room = roomOf(s, o.row, o.x);
    if (!room || room.rubble > 0 || !room.revealed) continue;
    const d = K.get(o.t === 'station' ? ST_ART[o.kind] : CONT_ART[o.t]);
    const h = d ? d.h : 60, y = floorY(o.row);
    if (Math.abs(wx - o.x) < o.w / 2 + 6 && wy > y - h - 6 && wy < y + 6) return { k: 'obj', o };
  }
  const dy = floorY(s.door.row);
  if (Math.abs(wx - s.door.x) < 28 && wy > dy - 96 && wy < dy + 4) return { k: home ? 'door' : 'exit' };
  for (let r = 0; r < s.rows; r++) {
    if (wy < ceilY(r) || wy > floorY(r) + SLAB) continue;
    const c = Math.floor(wx / ROOM_W); if (c < 0 || c >= s.cols) continue;
    const room = s.rooms[r][c];
    if (!room.revealed) return null;
    if (room.rubble > 0) return { k: 'room', room };
    return { k: 'floor', row: r, x: clamp(wx, 14, siteW(s) - 14) };
  }
  return null;
}

function handleTap(sx, sy) {
  if (!G || state !== 'play' || !$('modal').hidden || craftOpen) return;
  const now = performance.now();
  const dbl = now - lastTap.t < 320 && Math.hypot(sx - lastTap.x, sy - lastTap.y) < 30;
  lastTap = { t: now, x: sx, y: sy };
  const hadBubble = !$('bubble').hidden;
  closeBubble();
  const s = curSite();
  const [wx, wy] = s2w(sx, sy);
  const hit = hitTest(s, wx, wy);
  if (G.phase === 'scav') {
    if (!hit) { if (dbl) toggleZoom(sx, sy); return; }
    if (hit.k === 'exit') { toast('Eve dönmek için sağ üstteki düğmeye bas', 'icon.home'); scavAct({ k: 'floor', row: s.door.row, x: s.door.x + 10 }); return; }
    scavAct(hit); return;
  }
  if (G.phase !== 'day') return;
  if (!hit) { if (dbl) toggleZoom(sx, sy); else if (!hadBubble && G.sel) { G.sel = null; cardSig = {}; } return; }
  if (hit.k === 'char') {
    if (G.sel === hit.ch.id) { const p = charDrawPos(hit.ch); const [bx, by] = w2s(p.x, p.y - 80); openBubble(hit, bx, by); }
    else { G.sel = hit.ch.id; G.tut = Math.max(G.tut, 1); cardSig = {}; sfx('tap'); }
    return;
  }
  if (hit.k === 'floor') {
    if (dbl) { toggleZoom(sx, sy); return; }
    const ch = G.chars.find(c => c.id === G.sel && !c.away);
    if (ch) { cancelTasks(ch); startTask(ch, { type: 'walk', row: hit.row, x: hit.x }); sfx('tap'); }
    return;
  }
  let ay = sy - 30;
  if (hit.k === 'obj') { const d = K.get(hit.o.t === 'station' ? ST_ART[hit.o.kind] : CONT_ART[hit.o.t]); ay = w2s(hit.o.x, floorY(hit.o.row) - (d ? d.h : 60))[1] - 6; sx = w2s(hit.o.x, 0)[0]; }
  openBubble(hit, sx, Math.max(ay, 120));
  sfx('tap');
}
function toggleZoom(sx, sy) { setZoom(cam.user > 1.3 ? 1 : 1.9, s2w(sx, sy), sx, sy); }

addEventListener('keydown', e => {
  if (!G || state !== 'play') return;
  const k = e.key.toLowerCase();
  if (k === 'escape') { if (!$('bubble').hidden) closeBubble(); else if (craftOpen) closeCraft(); else if ($('modal').hidden) openMenu(); return; }
  if (!$('modal').hidden) return;
  if (k === ' ') { G.speed = G.speed ? 0 : 1; setSpeedUI(); e.preventDefault(); }
  else if (k === '1' || k === '2' || k === '3') { G.speed = +k; setSpeedUI(); }
  else if (k === 'c') craftOpen ? closeCraft() : openCraft();
});
